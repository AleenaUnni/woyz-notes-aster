<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOYZ Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F3;
    --panel:#FFFFFF;
    --border:#E2E5E1;
    --ink:#1B231F;
    --muted:#6E786F;
    --teal:#1F5F52;
    --teal-deep:#153F37;
    --teal-wash:#EAF2EF;
    --red:#D6472F;
    --red-wash:#FBEAE6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px; background:linear-gradient(145deg,#F4F5F3,#EAF2EF); }
  .login-screen.hidden{ display:none; }
  .login-card{ width:min(420px,100%); background:#fff; border:1px solid var(--border); border-radius:22px; padding:34px; box-shadow:0 24px 65px -34px rgba(20,35,29,.48); }
  .login-brand{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:27px; font-size:27px; font-weight:800; }
  .login-brand-pill{ display:inline-flex; align-items:center; gap:9px; padding:8px 16px 8px 10px; border:4px solid #F45155; border-radius:999px; background:#17171D; color:#fff; letter-spacing:1px; }
  .login-brand-dot{ width:27px; height:27px; border-radius:50%; background:#F45155; border:7px solid #452126; }
  .login-title{ margin:0 0 6px; font:600 27px 'Fraunces',serif; }
  .login-sub{ margin:0 0 23px; color:var(--muted); font-size:13px; }
  .login-label{ display:block; margin:14px 0 7px; font-size:12px; font-weight:700; }
  .login-input{ width:100%; height:44px; border:1.5px solid var(--border); border-radius:11px; padding:0 13px; font:14px 'Inter',sans-serif; outline:none; }
  .login-input:focus{ border-color:#8FB9AC; box-shadow:0 0 0 3px rgba(143,185,172,.2); }
  .login-submit{ width:100%; justify-content:center; margin-top:22px; height:44px; background:var(--teal); border-color:var(--teal); color:#fff; }
  .login-error{ min-height:18px; margin-top:12px; color:var(--red); font-size:12px; }
  .btn{ min-height:38px; border:1.5px solid var(--border); border-radius:10px; background:#fff; color:var(--ink); padding:0 14px; display:inline-flex; align-items:center; justify-content:center; gap:7px; font:700 13px 'Inter',sans-serif; cursor:pointer; transition:background .12s ease, border-color .12s ease, transform .1s ease; }
  .btn:hover{ background:#F6F7F5; }
  .btn:active{ transform:scale(.97); }
  .app{ display:none; height:100vh; min-height:0; overflow:hidden; }
  .app.authenticated{ display:grid; grid-template-columns:320px minmax(0,1fr); }
  .sidebar{ background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:20px 16px; min-width:0; min-height:0; overflow:hidden; }
  .admin-brand{ height:58px; display:flex; align-items:center; gap:12px; margin-bottom:24px; }
  .admin-brand-pill{ height:58px; border:3px solid #F45155; border-radius:999px; background:#17171D; color:#fff; display:flex; align-items:center; justify-content:center; gap:11px; padding:0 18px 0 14px; font-weight:800; font-size:24px; letter-spacing:1.1px; }
  .admin-brand-dot{ width:30px; height:30px; border-radius:50%; background:#F45155; border:8px solid #452126; }
  .admin-brand-word{ font-size:24px; font-weight:800; color:var(--ink); letter-spacing:0; }
  .sidebar-section-label{ display:none; }
  .admin-search{ margin:0 4px 12px; }
  .admin-search-input{ width:100%; height:42px; border:1.5px solid #D8E1E7; border-radius:11px; padding:0 12px; outline:none; color:var(--ink); background:#fff; font:800 13px 'Inter',sans-serif; }
  .admin-search-input::placeholder{ color:#8B958E; text-transform:uppercase; letter-spacing:.04em; }
  .admin-search-input:focus{ border-color:#8FB9AC; box-shadow:0 0 0 3px rgba(143,185,172,.18); }
  #adminVisitToggle{ display:none !important; }
  .sidebar .visit-toggle{ height:44px; margin:0 4px 16px; justify-content:center; }
  .sidebar .visit-toggle-btn{ height:34px; flex:1; font-size:13px; }
  .entry-list{ flex:1; min-height:0; display:flex; flex-direction:column; gap:6px; overflow:auto; overscroll-behavior:contain; padding-right:2px; }
  .entry{ position:relative; width:100%; border:1px solid transparent; background:transparent; border-radius:11px; padding:9px 40px 9px 10px; display:flex; align-items:center; gap:10px; cursor:pointer; text-align:left; color:var(--ink); }
  .entry:hover{ background:#F6F8F6; }
  .entry.uncopied{ background:var(--red-wash); border-color:#F3B3A9; color:#DB412D; }
  .entry.active{ background:var(--teal-wash); border-color:rgba(31,95,82,.35); color:var(--teal-deep); }
  .entry-avatar{ width:34px; height:34px; border-radius:50%; background:#E9F2EE; color:var(--teal); display:grid; place-items:center; font:800 13px 'IBM Plex Mono',monospace; flex:0 0 auto; }
  .entry.uncopied .entry-avatar{ background:#DE4D37; color:#fff; }
  .entry.active .entry-avatar{ background:var(--teal); color:#fff; }
  .entry-text{ min-width:0; flex:1; }
  .entry-owner{ position:absolute; right:9px; top:50%; transform:translateY(-50%); color:rgba(31,95,82,.76); font:800 10.5px 'IBM Plex Mono',monospace; }
  .entry.active .entry-owner{ color:var(--teal-deep); }
  .entry.uncopied .entry-owner{ color:rgba(219,65,45,.78); }
  .entry-name{ font-weight:800; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .entry-meta{ color:var(--muted); font:700 10.5px 'IBM Plex Mono',monospace; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .entry-submeta{ color:#87928B; font:700 10px 'IBM Plex Mono',monospace; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .main{ min-width:0; min-height:0; overflow:hidden; display:flex; flex-direction:column; background:#fff; }
  .main-topbar{ height:64px; min-height:64px; display:flex; align-items:center; gap:12px; padding:0 20px; border-bottom:1px solid var(--border); background:#fff; }
  .topbar-title{ font-weight:800; min-width:170px; }
  .topbar-meta{ color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .spacer{ flex:1; }
  .user-email{ display:none; }
  .visit-toggle{ height:38px; display:flex; align-items:center; gap:4px; padding:4px; border:1px solid #D8E1E7; border-radius:10px; background:#fff; flex-shrink:0; }
  .visit-toggle-btn{ height:28px; min-width:38px; border:0; border-radius:7px; background:transparent; color:var(--muted); font:800 12px 'Inter',sans-serif; cursor:pointer; }
  .visit-toggle-btn.active{ background:var(--teal); color:#fff; }
  .date-nav{ display:flex; align-items:center; gap:7px; flex-shrink:0; }
  .date-step,.date-today{ height:38px; border:1px solid var(--border); border-radius:10px; background:#EEF3F7; color:#263444; cursor:pointer; font-weight:800; }
  .date-step{ width:38px; font-size:23px; line-height:1; }
  .date-today{ padding:0 13px; background:var(--teal); border-color:var(--teal-deep); color:#fff; font-size:13px; box-shadow:0 4px 10px -6px var(--teal-deep); }
  .date-input{ height:38px; width:142px; border:1px solid #D8E1E7; border-radius:10px; background:#fff; color:#17212B; padding:0 10px; font:700 13px 'Inter',sans-serif; }
  .copy-btn{ border-color:rgba(31,95,82,0.3); color:var(--teal-deep); }
  .copy-btn:hover{ background:var(--teal-wash); }
  .copy-btn.copied{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .emr-status{ display:none; color:var(--muted); font-size:12px; font-weight:800; white-space:nowrap; }
  .emr-status.visible{ display:inline-flex; }
  .print-btn{ border-color:rgba(31,95,82,0.3); color:var(--teal-deep); }
  .print-btn:hover{ background:var(--teal-wash); }
  .rx-print-btn{ display:none; border-color:rgba(31,95,82,0.3); color:var(--teal-deep); min-width:74px; }
  .rx-print-btn:hover{ background:var(--teal-wash); }
  .rx-print-btn[disabled]{ opacity:.45; cursor:not-allowed; }
  .print-wrap{ position:relative; display:none; flex-shrink:0; }
  .print-wrap.visible{ display:block; }
  .print-wrap::after{ content:''; position:absolute; left:0; right:0; top:100%; height:10px; }
  .print-menu-btn{ min-width:86px; }
  .print-wrap:hover .print-menu-btn,
  .print-wrap:focus-within .print-menu-btn,
  .print-menu-btn.open{ background:var(--teal-wash); border-color:rgba(31,95,82,0.3); color:var(--teal-deep); }
  .print-menu{ position:absolute; top:calc(100% + 8px); right:0; min-width:174px; background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 18px 38px -24px rgba(20,35,29,.45); padding:6px; display:none; z-index:25; }
  .print-wrap:hover .print-menu,
  .print-wrap:focus-within .print-menu,
  .print-menu.open{ display:grid; gap:6px; }
  .print-menu .btn{ width:100%; min-height:42px; justify-content:center; border-radius:9px; }
  .print-menu .rx-print-btn,
  .print-menu .print-btn{ display:flex !important; }
  .print-menu .rx-print-btn:disabled{ background:#F6F7F5; color:#9BA8A4; border-color:#DDE5E1; }
  .timeline-wrap{ position:relative; flex-shrink:0; display:none; }
  .timeline-wrap.visible{ display:block; }
  .timeline-wrap::after{ content:''; position:absolute; left:0; right:0; top:100%; height:10px; }
  .timeline-btn{ min-width:104px; background:var(--teal); color:#fff; border-color:var(--teal); }
  .timeline-btn:hover,
  .timeline-btn.open{ background:var(--teal-deep); border-color:var(--teal-deep); }
  .timeline-menu{ position:absolute; top:calc(100% + 8px); right:0; width:260px; max-height:min(430px, calc(100vh - 120px)); overflow:auto; background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 18px 38px -24px rgba(20,35,29,.45); padding:6px; display:none; z-index:30; }
  .timeline-wrap:hover .timeline-menu,
  .timeline-wrap:focus-within .timeline-menu,
  .timeline-menu.open{ display:grid; gap:6px; }
  .timeline-item{ width:100%; border:1px solid rgba(31,95,82,.16); border-radius:9px; background:var(--teal-wash); color:var(--teal-deep); padding:10px 12px; text-align:left; cursor:pointer; font:800 13px 'Inter',sans-serif; }
  .timeline-item:hover,
  .timeline-item.active{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .timeline-item-meta{ display:block; margin-top:4px; color:inherit; opacity:.75; font:700 11px 'IBM Plex Mono',monospace; }
  .discharge-btn{
    border-color:#E5B45F;
    background:#FFF6E6;
    color:#8A5200;
  }
  .discharge-btn:hover{ background:#FFE9BE; border-color:#D49B35; }
  .discharge-btn.discharged{
    background:var(--teal-wash);
    color:var(--teal-deep);
    border-color:rgba(31,95,82,.28);
  }
  .discharge-btn.discharged:hover{ background:#D7ECE4; border-color:rgba(31,95,82,.38); }
  .admin-settings{ position:relative; flex-shrink:0; }
  .settings-menu{ position:absolute; top:calc(100% + 8px); right:0; width:154px; background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 18px 38px -24px rgba(20,35,29,.45); padding:6px; display:none; z-index:20; }
  .settings-menu.open{ display:block; }
  .settings-item{ width:100%; border:0; background:transparent; border-radius:9px; padding:10px 12px; text-align:left; font:700 13px 'Inter',sans-serif; color:var(--ink); cursor:pointer; }
  .settings-item:hover{ background:#F6F8F6; }
  .main-scroll{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:36px 42px 80px; }
  .note-title{ margin:0 0 20px; font:600 31px 'Fraunces',serif; }
  .admin-all-entries{ display:grid; gap:28px; }
  .admin-all-entry{ border-top:1.5px solid #C8D9D3; padding-top:22px; }
  .admin-all-entry:first-child{ border-top:0; padding-top:0; }
  .admin-all-entry-title{ margin:0 0 16px; font-size:22px; font-weight:800; }
  .admin-all-count{ margin:-8px 0 20px; color:var(--muted); font:800 13px 'IBM Plex Mono',monospace; }
  .note-editor{ width:100%; min-height:calc(100vh - 190px); border:0; outline:none; resize:vertical; background:#fff; color:#26302B; font:16px/1.55 'Inter',system-ui,sans-serif; padding:0; white-space:pre-wrap; }
  .note-editor p{ margin:0 0 10px; }
  .note-editor strong{ font-weight:800; color:#1E2521; }
  .note-editor .review-notes-title{
    display:block;
    margin:18px 0 20px;
    color:#1E2521;
    font:600 31px 'Fraunces',serif;
    line-height:1.15;
  }
  .note-editor .review-note-divider{
    width:50%;
    height:1px;
    border:0;
    border-top:1.5px solid #C9D5CF;
    margin:22px 0 14px;
  }
  .note-editor .rx-table{
    display:grid;
    gap:12px;
    margin:8px 0 18px;
    white-space:normal;
  }
  .note-editor .rx-row{
    display:grid;
    grid-template-columns:30px minmax(190px, 34%) minmax(0,1fr);
    column-gap:12px;
    align-items:start;
  }
  .note-editor .rx-number,
  .note-editor .rx-medicine{
    font-weight:800;
    color:#1E2521;
  }
  .note-editor .rx-instructions{
    display:grid;
    gap:2px;
    min-width:0;
  }
  .note-editor .rx-instructions div + div{ color:var(--muted); }
  .empty-state{ height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; color:var(--muted); text-align:center; padding:32px; }
  .empty-title{ font:600 30px 'Fraunces',serif; color:#1E2521; margin-bottom:8px; }
  .blocked{ color:var(--red); background:var(--red-wash); border:1px solid #F3B3A9; border-radius:12px; padding:14px; font-size:13px; }
  .modal{ position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; padding:22px; background:rgba(20,27,24,.34); }
  .modal.open{ display:flex; }
  .modal-card{ width:min(760px,100%); max-height:min(82vh,760px); overflow:auto; background:#fff; border:1px solid var(--border); border-radius:18px; box-shadow:0 26px 74px -34px rgba(15,24,21,.55); padding:24px; }
  .modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; }
  .modal-title{ margin:0 0 5px; font:600 27px 'Fraunces',serif; }
  .modal-sub{ margin:0; color:var(--muted); font-size:13px; }
  .modal-close{ width:36px; height:36px; border:1px solid var(--border); border-radius:10px; background:#fff; cursor:pointer; font-size:22px; line-height:1; }
  .danger-btn{ color:var(--red); border-color:#F3B3A9; }
  @media (max-width:900px){
    .app.authenticated{ grid-template-columns:270px 1fr; }
    .sidebar{ padding:16px 12px; }
    .main-scroll{ padding:26px 24px 70px; }
    .note-editor .rx-row{
      grid-template-columns:26px minmax(150px, 38%) minmax(0,1fr);
      column-gap:9px;
    }
  }
</style>
</head>
<body>
<section class="login-screen" id="loginScreen">
  <form class="login-card" id="loginForm">
    <div class="login-brand"><span class="login-brand-pill"><span class="login-brand-dot"></span>WOYZ</span><span>Admin</span></div>
    <h1 class="login-title">Sign in</h1>
    <label class="login-label" for="loginEmail">Email address</label>
    <input class="login-input" id="loginEmail" type="email" autocomplete="username" required>
    <label class="login-label" for="loginPassword">Password</label>
    <input class="login-input" id="loginPassword" type="password" autocomplete="current-password" required>
    <button class="btn login-submit" id="loginSubmit" type="submit">Sign in</button>
    <div class="login-error" id="loginError" role="alert"></div>
  </form>
</section>

<div class="app" id="appShell">
  <aside class="sidebar">
    <div class="admin-brand"><span class="admin-brand-pill"><span class="admin-brand-dot"></span><span>WOYZ</span></span><span class="admin-brand-word">Notes</span></div>
    <div class="visit-toggle" id="adminVisitToggle" aria-label="Visit type">
      <button class="visit-toggle-btn active" data-admin-visit-type="OP">OP</button>
      <button class="visit-toggle-btn" data-admin-visit-type="IP">IP</button>
    </div>
    <div class="admin-search">
      <input class="admin-search-input" id="adminSearchInput" type="search" autocomplete="off" placeholder="Search name or UHID" aria-label="Search notes by name or UHID">
    </div>
    <div class="sidebar-section-label" id="notesLabel">Notes</div>
    <div class="entry-list" id="entryList"></div>
  </aside>
  <main class="main">
    <div class="main-topbar">
      <div class="topbar-summary" hidden>
        <div class="topbar-title" id="topbarTitle">Admin notes</div>
        <div class="topbar-meta" id="topbarMeta">Select a user</div>
      </div>
      <div class="spacer"></div>
      <div class="user-email" id="userEmail"></div>
      <div class="date-nav" id="adminDateNav" aria-label="Visit date navigation">
        <button class="date-step" id="adminPreviousDateBtn" aria-label="Previous day">&lsaquo;</button>
        <input class="date-input" id="adminVisitDateInput" type="date" aria-label="Visit date">
        <button class="date-step" id="adminNextDateBtn" aria-label="Next day">&rsaquo;</button>
        <button class="date-today" id="adminTodayBtn" title="Jump to today"></button>
      </div>
      <button class="btn copy-btn" id="saveNoteBtn" style="display:none;">Review</button>
      <button class="btn discharge-btn" id="dischargeBtn" style="display:none;">Discharge</button>
      <button class="btn copy-btn" id="sendEmrBtn" style="display:none;">Send to EMR</button>
      <span class="emr-status" id="emrStatus" aria-live="polite">Coming soon</span>
      <button class="btn copy-btn" id="copyBtn" style="display:none;">Copy note</button>
      <div class="print-wrap" id="adminPrintWrap">
        <button class="btn print-menu-btn" id="adminPrintMenuBtn" type="button" aria-label="Print options" aria-haspopup="true" aria-expanded="false">Print</button>
        <div class="print-menu" id="adminPrintMenu">
          <button class="btn rx-print-btn" id="rxPrintBtn" type="button" aria-label="Print prescription" title="Print Prescription">Prescription</button>
          <button class="btn print-btn" id="printBtn" type="button" aria-label="Print visit note" title="Print visit note">Visit Note</button>
        </div>
      </div>
      <div class="timeline-wrap" id="adminTimelineWrap">
        <button class="btn timeline-btn" id="adminTimelineBtn" type="button" aria-label="Patient timeline" aria-haspopup="true" aria-expanded="false">Timeline</button>
        <div class="timeline-menu" id="adminTimelineMenu"></div>
      </div>
      <div class="admin-settings">
        <button class="btn" id="adminSettingsBtn" aria-expanded="false">Settings</button>
        <div class="settings-menu" id="adminSettingsMenu">
          <button class="settings-item" id="signoutBtn" type="button">Sign out</button>
        </div>
      </div>
    </div>
    <div class="main-scroll" id="mainScroll"></div>
  </main>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
import { browserLocalPersistence, getAuth, onAuthStateChanged, setPersistence, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
import { getFirestore, addDoc, collection, collectionGroup, doc, getDoc, onSnapshot, serverTimestamp, setDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';
import { firebaseConfig } from './firebase-config.js';

const MASTER_ADMIN_UID = 'kzlnh5rBzpTlYEqF7Ou35F1YWaa2';
const MASTER_ADMIN_EMAIL = 'drgigy@gmail.com';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const authPersistenceReady = setPersistence(auth, browserLocalPersistence).catch(error => {
  console.warn('Unable to enable persistent login:', error);
});
const db = getFirestore(app);

function cleanLogValue(value, maxLength = 160){
  return String(value ?? '').replace(/\s+/g, ' ').trim().slice(0, maxLength);
}

function noteLogPayload(note = {}){
  const patient = note.data?.patientData || {};
  return {
    noteId:cleanLogValue(note.id || '', 120),
    noteOwnerUid:cleanLogValue(note.userId || '', 120),
    noteType:cleanLogValue(noteDocumentMode(note) || note.data?.heading || '', 120),
    patientName:cleanLogValue(patient.name || '', 160),
    uhid:cleanLogValue(patient.uhid || note.data?.uhid || '', 80),
    visitDate:cleanLogValue(note.data?.visitDate || '', 20),
    visitType:cleanLogValue(note.data?.visitType || '', 20)
  };
}

function safeLogActivity(action, info = {}){
  const user = auth.currentUser;
  if (!user) return;
  const payload = {
    action:cleanLogValue(action, 80),
    page:'index',
    userId:user.uid,
    email:cleanLogValue(user.email || '', 160),
    createdAt:serverTimestamp()
  };
  const logFieldLimits = {noteId:120,noteOwnerUid:120,noteType:120,patientName:160,uhid:80,visitDate:20,visitType:20};
  Object.entries(logFieldLimits).forEach(([key, maxLength]) => {
    const value = cleanLogValue(info[key] || '', maxLength);
    if (value) payload[key] = value;
  });
  addDoc(collection(db,'activityLogs'), payload).catch(error => console.warn('Activity log failed:', error));
}

const loginScreen = document.getElementById('loginScreen');
const loginForm = document.getElementById('loginForm');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const loginSubmit = document.getElementById('loginSubmit');
const loginError = document.getElementById('loginError');
const appShell = document.getElementById('appShell');
const entryList = document.getElementById('entryList');
const adminSearchInput = document.getElementById('adminSearchInput');
const mainScroll = document.getElementById('mainScroll');
const topbarTitle = document.getElementById('topbarTitle');

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
}

function compactNoteText(text){
  return String(text || '')
    .replace(/\r\n/g, '\n')
    .replace(/^(Patient Name:\s*[^\n]+)\n(Age:\s*[^\n]+)\n(UHID:\s*[^\n]+)\n(Sex:\s*[^\n]+)/im, '$1 · $2 · $3 · $4')
    .split(/\n{2,}/)
    .map(block => {
      const lines = block.split('\n').map(line => line.trim()).filter(Boolean);
      if (!lines.length) return '';
      if (lines.length > 1 && /:$/.test(lines[0])) return `${lines[0]} ${lines.slice(1).join(' ')}`;
      return lines.join('\n');
    })
    .filter(Boolean)
    .join('\n\n');
}

function escapeRegExp(value){
  return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function isDischargeSummaryNote(note){
  const mode = String(note?.data?.selectedMode || note?.data?.heading || '').trim();
  return /discharge summary/i.test(mode);
}

function formatDischargeSummaryText(text){
  let normalized = String(text || '').replace(/\r\n/g, '\n').trim();
  if (!normalized) return '';
  normalized = normalized
    .replace(/(^|\n)\s*Discharge Summary(?:\s*[-–—]\s*[^\n]*)?\s*(?=\n|$)/gi, '\n')
    .replace(/^Discharge Summary\s+(?=(?:Patient Name|Name)\s*:)/i, '')
    .replace(/(^|\s+)Discharge Summary\s+(?=(?:Patient Name|Discharge Summary Name|Name|Age\/Gender|Age|UHID|UHCID|Sex|Gender|IP No\.?|Address|Consultant|DOA|DOD|DIAGNOSIS)\s*:)/gi, '\n\n');
  const headingTokens = [];
  DISCHARGE_SUMMARY_HEADINGS
    .sort((a,b) => b.length - a.length)
    .forEach(label => {
      const canonical = label === 'IP No' ? 'IP No.' : label === 'PROCEDURE/OPERATION NOTES' ? 'PROCEDURE / OPERATION NOTES' : label;
      const token = `__DS_HEADING_${headingTokens.length}__`;
      headingTokens.push([token, canonical]);
      normalized = normalized.replace(new RegExp(`(^|\\s+)(${escapeRegExp(label)})\\s*:\\s*`, 'gi'), `\n\n${token}:\n`);
    });
  headingTokens.forEach(([token, canonical]) => {
    normalized = normalized.split(`${token}:`).join(`${canonical}:`);
  });
  normalized = compactDischargeDemographicHeader(normalized);
  normalized = normalizeDischargeLabValues(normalized);
  DISCHARGE_INLINE_LABELS
    .sort((a,b) => b.length - a.length)
    .forEach(label => {
      const canonical = label
        .replace(/^secondary survey$/i, 'Secondary survey')
        .replace(/^oral cavity$/i, 'Oral cavity')
        .replace(/^right upper limb$/i, 'Right upper limb')
        .replace(/^right lower limb$/i, 'Right lower limb')
        .replace(/^local examination$/i, 'Local examination');
      normalized = normalized.replace(new RegExp(`(^|[\\s.])(${escapeRegExp(label)})\\s*[:;-]\\s*`, 'gi'), (match, leading) => {
        const prefix = leading && leading.trim() === '.' ? '.\n' : '\n';
        return `${prefix}${canonical}: `;
      });
    });
  normalized = normalized
    .replace(/\s+(\d+[.)])\s*/g, '\n$1 ')
    .replace(/^Discharge Summary\s*/i, '')
    .replace(/(^|\n)\s*Discharge Summary\s*(?=\n|$)/gi, '\n')
    .replace(/^(?:\n\s*)+/, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
  return normalized;
}

function isDischargeSectionHeadingLine(line){
  return new RegExp(`^(?:${DISCHARGE_SUMMARY_HEADINGS.map(escapeRegExp).join('|')})\\s*:`, 'i').test(String(line || '').trim());
}

function addStandardBloodUnit(line){
  const cleaned = String(line || '')
    .replace(/\s*[.]$/, '')
    .replace(/\b(\d+)\.\s+(\d+)\b/g, '$1.$2')
    .replace(/\blakhs\b/gi, 'lakh')
    .replace(/\s+/g, ' ')
    .trim();
  if (!cleaned || /(?:g\/dL|mg\/dL|mmol\/L|mEq\/L|cells\/cumm|\/cu\.?mm|\/cumm|lakh\/cumm|U\/L|mm\/hr|mg\/L|%|µmol\/L|umol\/L|µIU\/mL|mcIU\/mL)/i.test(cleaned)) return cleaned;
  const unitRules = [
    [/^(Hemoglobin|Hb)\s*:\s*([\d.]+)\s*$/i, '$1: $2 g/dL'],
    [/^(Total count|TC)\s*:\s*([\d.]+)\s*$/i, '$1: $2 cells/cumm'],
    [/^(Platelet count|Platelets?)\s*:\s*([\d.]+(?:\s*lakh)?)\s*$/i, '$1: $2/cumm'],
    [/^(Creatinine|Urea|RBS|FBS|PPBS)\s*:\s*([\d.]+)\s*$/i, '$1: $2 mg/dL'],
    [/^(HbA1c)\s*:\s*([\d.]+)\s*$/i, '$1: $2%'],
    [/^(Sodium|Potassium|Chloride)\s*:\s*([\d.]+)\s*$/i, '$1: $2 mmol/L'],
    [/^(SGOT|SGPT|ALT|AST)\s*:\s*([\d.]+)\s*$/i, '$1: $2 U/L'],
    [/^(ESR)\s*:\s*([\d.]+)\s*$/i, '$1: $2 mm/hr'],
    [/^(CRP)\s*:\s*([\d.]+)\s*$/i, '$1: $2 mg/L'],
    [/^(Total cholesterol|Triglycerides|HDL|LDL)\s*:\s*([\d.]+)\s*$/i, '$1: $2 mg/dL'],
    [/^(Homocysteine)\s*:\s*([\d.]+)\s*$/i, '$1: $2 µmol/L']
  ];
  for (const [pattern, replacement] of unitRules){
    if (pattern.test(cleaned)) return cleaned.replace(pattern, replacement);
  }
  return cleaned;
}

function normalizeDischargeLabValues(text){
  const labLabelPattern = /^(Hemoglobin|Hb|ESR|CRP|Total count|TC|Platelet count|Platelets?|Creatinine|Urea|RBS|FBS|PPBS|HbA1c|Sodium|Potassium|Chloride|SGOT|SGPT|ALT|AST|Bilirubin|Total bilirubin|Direct bilirubin|Indirect bilirubin|Total cholesterol|Triglycerides|HDL|LDL|Homocysteine)\s*:\s*(.*)$/i;
  const lines = String(text || '').replace(/\r\n/g, '\n').split('\n');
  const result = [];
  let inLab = false;
  for (let index = 0; index < lines.length; index += 1){
    const line = lines[index];
    const trimmed = line.trim();
    if (/^LAB\s*:/i.test(trimmed)){
      inLab = true;
      result.push(line);
      continue;
    }
    if (inLab && trimmed && isDischargeSectionHeadingLine(trimmed) && !/^LAB\s*:/i.test(trimmed)){
      inLab = false;
    }
    if (inLab){
      const match = trimmed.match(labLabelPattern);
      if (match && !match[2].trim()){
        const next = lines[index + 1]?.trim() || '';
        if (next && !labLabelPattern.test(next) && !isDischargeSectionHeadingLine(next)){
          result.push(addStandardBloodUnit(`${match[1]}: ${next}`));
          index += 1;
          continue;
        }
      }
      if (match && match[2].trim()){
        result.push(addStandardBloodUnit(trimmed));
        continue;
      }
    }
    result.push(line);
  }
  return result.join('\n');
}

function compactDischargeDemographicHeader(text){
  const lines = String(text || '').replace(/\r\n/g, '\n').split('\n');
  const values = new Map();
  const consumed = new Set();
  const demoPattern = /^(Patient Name|Discharge Summary Name|Name|Age\/Gender|Age|UHID|UHCID|Sex|Gender|IP No\.?|Address|Consultant|DOA|DOD):\s*(.*)$/i;
  const sectionPattern = /^(?:DIAGNOSIS|PROCEDURE DONE|DRUG ALLERGY|HISTORY|CLINICAL EXAMINATION|INVESTIGATIONS|LAB|RADIOLOGY|PROCEDURE\s*\/\s*OPERATION NOTES|OTHERS|GENERAL INSTRUCTIONS|REASON FOR ADMISSION|COURSE IN HOSPITAL|MEDICATIONS ADMINISTERED|CONDITION AT DISCHARGE|ADVICE ON DISCHARGE|MEDICATIONS|HOME MEDICATIONS|DIET ADVICE|FOLLOW UP DATE|REVIEW|WHEN TO OBTAIN URGENT CARE):/i;
  const setValue = (label, rawValue) => {
    const value = String(rawValue || '').trim() || 'NIL';
    const normalized = String(label || '').trim().toLowerCase();
    const setIfUseful = (key, nextValue) => {
      const cleaned = String(nextValue || '').trim();
      if (!cleaned) return;
      if (!values.has(key) || isNilLike(values.get(key))) values.set(key, cleaned);
    };
    if (normalized === 'patient name' || normalized === 'discharge summary name' || normalized === 'name'){
      setIfUseful('Patient Name', value);
      return;
    }
    if (normalized === 'age/gender'){
      const parts = value.split('/').map(item => item.trim()).filter(Boolean);
      setIfUseful('Age', parts[0] || value);
      if (parts[1]) setIfUseful('Sex', parts[1]);
      return;
    }
    if (normalized === 'age'){
      setIfUseful('Age', value);
      return;
    }
    if (normalized === 'uhid' || normalized === 'uhcid'){
      setIfUseful('UHID', value);
      return;
    }
    if (normalized === 'sex' || normalized === 'gender'){
      setIfUseful('Sex', value);
    }
  };
  for (let index = 0; index < lines.length; index += 1){
    if (sectionPattern.test(lines[index].trim())) break;
    const match = lines[index].trim().match(demoPattern);
    if (!match) continue;
    const label = match[1].trim();
    let value = match[2].trim();
    consumed.add(index);
    let cursor = index + 1;
    while (!value && cursor < lines.length && !demoPattern.test(lines[cursor].trim()) && !sectionPattern.test(lines[cursor].trim())){
      const candidate = lines[cursor].trim();
      consumed.add(cursor);
      if (candidate) value = candidate;
      cursor += 1;
    }
    setValue(label, value);
  }
  if (!DISCHARGE_DEMOGRAPHIC_LABELS.some(label => values.has(label))) return text;
  const keepLines = lines.filter((line, index) => !consumed.has(index));
  while (keepLines.length && !keepLines[0].trim()) keepLines.shift();
  const valueFor = label => values.get(label) || 'NIL';
  const header = [
    `Patient Name: ${valueFor('Patient Name')}`,
    `Age: ${valueFor('Age')}`,
    `UHID: ${valueFor('UHID')}`,
    `Sex: ${valueFor('Sex')}`
  ].join('\n');
  return `${header}\n\n${keepLines.join('\n')}`.trim();
}

function normalizeNumberedSectionHeadings(text){
  return String(text || '')
    .replace(/\r\n/g, '\n')
    .replace(/(^|\n)\s*\d+[.)]\s*(Review Note(?:\s*\([^)]*\))?|Review of Investigations|Current Medications|Medications|Prescription|Rx|R\/x|Advice|Instructions?|Treatment Plan|Follow[- ]?up):\s*/gi, (match, leadingBreak, label) => {
      const normalizedLabel = /^(?:Rx|R\/x)$/i.test(label.trim()) ? 'Prescription' : label.trim();
      return `${leadingBreak}${leadingBreak ? '\n' : ''}${normalizedLabel}:\n`;
    })
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function reviewNoteTimestampValue(heading){
  const match = String(heading || '').match(/^Review Note\s*\(([^)]*)\):$/i);
  if (!match) return null;
  const parts = match[1].match(/(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})(?:,\s*)?(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if (!parts) return null;
  let [, day, month, year, hour, minute, meridiem] = parts;
  year = Number(year);
  if (year < 100) year += 2000;
  hour = Number(hour);
  minute = Number(minute);
  if (meridiem){
    const period = meridiem.toUpperCase();
    if (period === 'PM' && hour < 12) hour += 12;
    if (period === 'AM' && hour === 12) hour = 0;
  }
  const timestamp = new Date(year, Number(month) - 1, Number(day), hour, minute).getTime();
  return Number.isFinite(timestamp) ? timestamp : null;
}

function organizeIpReviewNotes(text){
  const normalized = normalizeNumberedSectionHeadings(text).replace(/\r\n/g, '\n').trim();
  if (!normalized) return '';
  const lines = normalized.split('\n');
  const introLines = [];
  const reviewBlocks = [];
  let currentBlock = null;
  lines.forEach(line => {
    if (/^Review Note(?:\s*\([^)]*\))?:$/i.test(line.trim())){
      if (currentBlock) reviewBlocks.push(currentBlock);
      currentBlock = [line];
      return;
    }
    if (currentBlock) currentBlock.push(line);
    else if (!/^Review Notes:$/i.test(line.trim())) introLines.push(line);
  });
  if (currentBlock) reviewBlocks.push(currentBlock);
  if (!reviewBlocks.length) return normalized;
  const indexedBlocks = reviewBlocks.map((block, index) => ({
    block,
    index,
    timestamp: reviewNoteTimestampValue(block[0])
  }));
  const allTimestamped = indexedBlocks.every(item => item.timestamp !== null);
  const orderedBlocks = allTimestamped
    ? indexedBlocks.sort((a, b) => b.timestamp - a.timestamp || b.index - a.index)
    : indexedBlocks.reverse();
  const intro = introLines.join('\n').trim();
  const reviews = orderedBlocks
    .map(item => item.block.join('\n').trim())
    .filter(Boolean)
    .join('\n\n');
  return [intro, 'Review Notes:', reviews].filter(Boolean).join('\n\n');
}

function displayNoteTextForNote(note, text){
  if (isDischargeSummaryNote(note)) return formatDischargeSummaryText(text);
  const normalized = normalizeNumberedSectionHeadings(text);
  return noteVisitType(note) === 'IP' ? organizeIpReviewNotes(normalized) : normalized;
}

function simpleRichNoteHtml(text){
  return String(text || '')
    .split('\n')
    .map(line => {
      const escaped = escapeHtml(line);
      if (/^Review Notes:$/i.test(line.trim())) return `<span class="review-notes-title">${escaped}</span>`;
      const formatted = escaped.replace(/^([^:<\n]{2,90}:)(\s*)/, '<strong>$1</strong>$2');
      return /^Review Note(?:\s*\([^)]*\))?:$/i.test(line.trim()) ? `<hr class="review-note-divider">${formatted}` : formatted;
    })
    .join('<br>');
}

function richNoteHtml(text, {includeMalayalam = true} = {}){
  const normalized = normalizeNumberedSectionHeadings(text);
  const prescriptionPattern = new RegExp(`(^|\\n)(Prescription:)\\s*\\n([\\s\\S]*?)(?=\\n+${NOTE_SECTION_LOOKAHEAD}:|$)`, 'gi');
  let html = '';
  let lastIndex = 0;
  for (const match of normalized.matchAll(prescriptionPattern)){
    const labelIndex = match.index + match[1].length;
    html += simpleRichNoteHtml(normalized.slice(lastIndex, labelIndex));
    html += `<strong>${escapeHtml(match[2])}</strong><br><div class="rx-table">${prescriptionRowsHtml(match[3], {includeMalayalam})}</div>`;
    lastIndex = match.index + match[0].length;
  }
  html += simpleRichNoteHtml(normalized.slice(lastIndex));
  return html;
}

function initials(value){
  return String(value || 'N').split(' ').filter(Boolean).slice(0,2).map(part => part[0]).join('').toUpperCase();
}

function twoLetterCode(value, fallback){
  const label = String(value || fallback || 'NA').trim();
  const parts = label.split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return label.replace(/[^a-z0-9]/gi,'').slice(0,2).toUpperCase().padEnd(2,'N');
}

function noteOwnerCode(note, fallback){
  const credential = userProfiles[note.userId]?.credentialName || fallback || '';
  return twoLetterCode(credential, initials(notePatientName(note)));
}

function isNilLike(value){
  return /^(nil|none|no|not applicable|n\/a|na|negative)$/i.test(String(value || '').trim());
}

function cleanAge(value){
  const text = String(value || '').trim();
  if (!text || /^nil$/i.test(text)) return 'NIL';
  const number = text.match(/\d+(?:\.\d+)?/)?.[0];
  return number || text.replace(/\b(years?|yrs?|old)\b/gi, '').trim() || 'NIL';
}

function extractPatientFromNote(text, fallback = {}){
  const source = String(text || '').replace(/\r\n/g, '\n');
  const stopLabels = 'Patient\\s+Name|Discharge\\s+Summary\\s+Name|Name|Age\\/Gender|Age|UHID|UHCID|Sex|Gender|IP\\s+No\\.?|Address|Consultant|DOA|DOD|Date';
  const findField = labelPattern => {
    const match = source.match(new RegExp(`(?:^|\\n|\\s)(?:${labelPattern}):\\s*([\\s\\S]*?)(?=\\s+(?:${stopLabels}):|\\n|$)`, 'i'));
    return match?.[1]?.trim();
  };
  const ageGender = findField('Age\\/Gender');
  const ageFromCombined = ageGender?.split('/')[0]?.trim();
  const sexFromCombined = ageGender?.split('/').slice(1).join('/').trim();
  return {
    name:findField('Patient\\s+Name|Discharge\\s+Summary\\s+Name|Name') || fallback?.name || 'NIL',
    age:findField('Age') || ageFromCombined || fallback?.age || 'NIL',
    uhid:findField('UHID|UHCID') || fallback?.uhid || 'NIL',
    sex:findField('Sex|Gender') || sexFromCombined || fallback?.sex || 'NIL'
  };
}

function fullVisitDateLabel(value){
  const [year,month,day] = String(value || '').split('-').map(Number);
  if (!year || !month || !day) return value || 'Undated';
  const date = new Date(year, month - 1, day);
  return `${date.toLocaleDateString('en-US', {weekday:'long'})}, ${date.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'})}`;
}

function compactSex(value){
  const text = String(value || '').trim() || 'NIL';
  if (/^f(emale)?\b/i.test(text)) return 'F';
  if (/^m(ale)?\b/i.test(text)) return 'M';
  return text;
}

function compactPatientMetaText(value){
  return String(value || '')
    .replace(/\bFemale\b/gi, 'F')
    .replace(/\bMale\b/gi, 'M')
    .replace(/\b(\d+(?:\.\d+)?)\s*(?:years?|yrs?|old)\b/gi, '$1');
}

function removeNilSectionsForCopy(text){
  const protectedInlineLabels = new Set(['patient name','age','uhid']);
  return String(text || '')
    .replace(/\r\n/g, '\n')
    .split(/\n{2,}/)
    .map(block => block.trim())
    .map(block => {
      const lines = block.split('\n').map(line => line.trim()).filter(Boolean);
      if (!lines.length) return '';
      if (lines.length === 1){
        const inlineMatch = lines[0].match(/^([^:]+):\s*(.*)$/);
        if (!inlineMatch) return lines[0];
        const label = inlineMatch[1].trim().toLowerCase();
        return protectedInlineLabels.has(label) || !isNilLike(inlineMatch[2]) ? lines[0] : '';
      }
      if (/:$/.test(lines[0]) && isNilLike(lines.slice(1).join(' '))) return '';
      return lines.filter(line => {
        const inlineMatch = line.match(/^([^:]+):\s*(.*)$/);
        if (!inlineMatch) return true;
        const label = inlineMatch[1].trim().toLowerCase();
        return protectedInlineLabels.has(label) || !isNilLike(inlineMatch[2]);
      }).join('\n');
    })
    .filter(Boolean)
    .join('\n\n')
    .trim();
}

function canonicalDischargeCopyHeading(label){

  if (normalized === 'PROCEDURE/OPERATION NOTES') return 'PROCEDURE / OPERATION NOTES';
  if (normalized === 'IP NO') return 'IP No.';
  return normalized;
}

}

function dischargeCopySections(text){
  const sectionMap = new Map(DISCHARGE_COPY_HEADINGS.map(heading => [heading, []]));
  const headingPattern = new RegExp(`^(${DISCHARGE_COPY_HEADINGS.map(escapeRegExp).join('|')}|PROCEDURE/OPERATION NOTES)\\s*:\\s*(.*)$`, 'i');
  const optionalHeadingPattern = /^([A-Z][A-Z\s/&()-]{2,}CONSULTATION)\s*:\s*(.*)$/i;
  const optionalHeadings = [];
  const lines = formatDischargeSummaryText(text).replace(/\r\n/g, '\n').split('\n');
  let currentHeading = null;
  lines.forEach(rawLine => {
    const line = rawLine.trim();
    if (!line) {
      if (currentHeading) sectionMap.get(currentHeading).push('');
      return;
    }
    if (isDischargeDemographicLine(line)) return;
    const headingMatch = line.match(headingPattern);
    if (headingMatch){
      currentHeading = canonicalDischargeCopyHeading(headingMatch[1]);
      const inlineValue = headingMatch[2].trim();
      if (inlineValue) sectionMap.get(currentHeading).push(inlineValue);
      return;
    }
    const optionalHeadingMatch = line.match(optionalHeadingPattern);
    if (optionalHeadingMatch){
      currentHeading = optionalHeadingMatch[1].trim().toUpperCase().replace(/\s+/g, ' ');
      if (!sectionMap.has(currentHeading)){
        sectionMap.set(currentHeading, []);
        optionalHeadings.push(currentHeading);
      }
      const inlineValue = optionalHeadingMatch[2].trim();
      if (inlineValue) sectionMap.get(currentHeading).push(inlineValue);
      return;
    }
    if (currentHeading) sectionMap.get(currentHeading).push(rawLine.trimEnd());
  });
  const courseIndex = DISCHARGE_COPY_HEADINGS.indexOf('COURSE IN HOSPITAL');
  const orderedHeadings = [
    ...DISCHARGE_COPY_HEADINGS.slice(0, courseIndex + 1),
    ...optionalHeadings,
    ...DISCHARGE_COPY_HEADINGS.slice(courseIndex + 1)
  ];
  return orderedHeadings.map(heading => {
    const content = (sectionMap.get(heading) || []).join('\n').replace(/\n{3,}/g, '\n\n').trim();
    return {heading, content: content || 'Nil'};
  });
}

function dischargeCopyPlainText(text){
  return dischargeCopySections(text)
    .map(({heading, content}) => `${heading} :\n${content}`)
    .join('\n\n')
    .trim();
}

function dischargeCopyHtml(text){
  const sections = dischargeCopySections(text)
    .map(({heading, content}) => {
      const contentHtml = escapeHtml(content).replace(/\n/g, '<br>');
      return `<p style="margin:0 0 14px 0;"><strong>${escapeHtml(heading)}</strong> :<br>${contentHtml}</p>`;
    })
    .join('');
  return `<div style="font-family:Candara, Arial, sans-serif;font-size:14px;line-height:1.35;color:#000;">${sections}</div>`;
}

function adminClipboardPayloadForNote(note, text){
  if (isDischargeSummaryNote(note)){
    return {
      text: dischargeCopyPlainText(text),
      html: dischargeCopyHtml(text)
    };
  }
  return {text: removeNilSectionsForCopy(text), html: ''};
}

function notePatientName(note){
  const name = note.data.patientData?.name;
  return name && name !== 'NIL' ? name : 'Untitled note';
}

function patientTimelineKey(note){
  const patient = note?.data?.patientData || {};
  const uhid = String(patient.uhid || '').trim().toLowerCase();
  if (uhid && uhid !== 'nil') return `uhid:${uhid}`;
  return [
    patient.name,
    cleanAge(patient.age),
    compactSex(patient.sex)
  ].map(value => String(value || '').trim().toLowerCase()).join('|');
}

function noteDocumentMode(note){
  return String(note?.data?.selectedMode || note?.data?.heading || '').trim();
}

function isStandaloneDocumentNote(note){
  return /^(?:Reply letter|Medical certificate|Discharge summary)(?: draft)?$/i.test(noteDocumentMode(note));
}

function shouldShowCombinedTimeline(seedNote){
  return false;
}

function patientTimelineNotes(seedNote){
  if (!seedNote) return [];
  if (!shouldShowCombinedTimeline(seedNote)) return [seedNote];
  const key = patientTimelineKey(seedNote);
  return allNotes
    .filter(note => note.data?.deleted !== true)
    .filter(note => noteVisitType(note) === noteVisitType(seedNote))
    .filter(note => patientTimelineKey(note) === key)
    .filter(note => !isStandaloneDocumentNote(note) || timelineEntryKey(note) === timelineEntryKey(seedNote))
    .sort((a,b) => noteCreatedTime(a) - noteCreatedTime(b));
}

function orderedPatientTimelineNotes(seedNote){
  const notes = patientTimelineNotes(seedNote);
  if (notes.length <= 1) return notes;
  const first = notes[0];
  const rest = notes.slice(1).sort((a,b) => noteTime(b) - noteTime(a));
  return [first, ...rest];
}

function timelineEntryKey(note){
  return note?.path || `${note?.userId || ''}:${note?.id || ''}`;
}

function noteByTimelineEntryKey(key){
  if (!key || key === 'all') return null;
  return allNotes.find(note => timelineEntryKey(note) === key) || null;
}

function noteTimelineTitle(note){
  const mode = note.data.selectedMode || note.data.heading || 'Visit Note';
  const dateText = fullVisitDateLabel(note.data.visitDate || dateInputValue(selectedVisitDate)).replace(/^[^,]+,\s*/, '');
  const timeText = note.data.createdAtLabel ? String(note.data.createdAtLabel).split(',').slice(1).join(',').trim() : '';
  return `${mode} - ${dateText}${timeText ? `, ${timeText}` : ''}`;
}

function noteVisitType(note){
  return note.data?.visitType === 'IP' ? 'IP' : 'OP';
}

function prescriptionTextFromNote(text){
  const normalized = normalizeNumberedSectionHeadings(text);
  const sections = [];
  const pattern = /(?:^|\n)Prescription:[ \t]*\n([\s\S]*?)(?=\n+(?:Patient Name|Age|UHID|Sex|Presenting Complaint|History of Present Illness|Past Medical or Surgical History|Allergies|Family History|Personal History|Examination Findings|Review of Investigations|Current Medications|Diagnosis|Treatment Plan|Advice|Instructions?|Follow[- ]?up|Review Note(?:\s*\([^)]*\))?):|$)/gi;
  for (const match of normalized.matchAll(pattern)){
    const prescription = String(match[1] || '').trim();
    if (prescription && !isNilLike(prescription)) sections.push(prescription);
  }
  return sections.join('\n');
}

function selectedAdminNote(){
  return allNotes.find(item => item.id === selectedNoteId && item.userId === selectedUserId) || null;
}

function selectedTimelineNote(){
  if (selectedTimelineEntryId === 'all') return selectedAdminNote();
  return noteByTimelineEntryKey(selectedTimelineEntryId) || selectedAdminNote();
}

function selectedPrescriptionText(note = selectedTimelineNote()){
  if (!note || noteVisitType(note) !== 'OP') return '';
  const editor = document.getElementById('adminNoteEditor');
  return prescriptionTextFromNote(editorPlainText(editor) || note.data?.transcription || '');
}

function updatePrescriptionPrintButton(note){

  rxPrintBtn.title = text ? 'Print Prescription' : 'No prescription found in this note';
}

function prescriptionRowsHtml(text, {includeMalayalam = true} = {}){
  const lines = String(text || '').replace(/\r\n/g, '\n').split('\n').map(line => line.trim()).filter(Boolean);
  const rows = [];
  let pendingNumber = null;
  const medicineStartPattern = /^(?:\d+[.)]\s*)?(?:Tablet|Cap|Capsule|Syrup|Inj|Injection)\b/i;
  const dosePattern = /\b\d+(?:\.\d+)?\s*(?:mg|mcg|g|ml|units?|iu)\b/i;
  const instructionStartPattern = /^(?:take|inject|apply|use|instill|inhale|nebulize)\b/i;
  const isMedicineLine = line => (medicineStartPattern.test(line) || dosePattern.test(line)) && !instructionStartPattern.test(line);
  const isNumberedMedicineLine = line => {
    const match = String(line || '').match(/^\d+[.)]\s+(.+)$/);
    return Boolean(match && isMedicineLine(match[1]));
  };
  const isMalayalamLine = line => /[\u0D00-\u0D7F]/.test(line);
  const isSectionHeading = line => /^(?:Patient Name|Age|UHID|Sex|Presenting Complaint|History of Present Illness|Past Medical or Surgical History|Allergies|Family History|Personal History|Examination Findings|Review of Investigations|Current Medications|Diagnosis|Treatment Plan|Advice|Instructions?|Follow[- ]?up|Review Note(?:\s*\([^)]*\))?):$/i.test(line);
  for (let index = 0; index < lines.length; index += 1){
    if (isSectionHeading(lines[index])) break;
    const numberOnlyMatch = lines[index].match(/^(\d+[.)])$/);
    if (numberOnlyMatch){
      pendingNumber = numberOnlyMatch[1];
      continue;
    }
    const medicineMatch = lines[index].match(/^(\d+[.)])\s*(.+)$/);
    if (!medicineMatch && isMedicineLine(lines[index])){
      const english = lines[index + 1] && !isNumberedMedicineLine(lines[index + 1]) && !isMedicineLine(lines[index + 1]) && !isMalayalamLine(lines[index + 1]) ? lines[index + 1] : '';
      const localIndex = english ? index + 2 : index + 1;
      const local = lines[localIndex] && !isNumberedMedicineLine(lines[localIndex]) && !isMedicineLine(lines[localIndex]) ? lines[localIndex] : '';
      rows.push({
        number:`${rows.length + 1}.`,
        medicine:lines[index],
        english,
        local
      });
      pendingNumber = null;
      if (english) index += 1;
      if (local) index += 1;
      continue;
    }
    if (!medicineMatch || !isMedicineLine(medicineMatch[2])){
      const text = medicineMatch ? medicineMatch[2].trim() : lines[index];
      const row = rows[rows.length - 1];
      if (row){
        if (!row.english && !isMalayalamLine(text)) row.english = text;
        else if (!row.local) row.local = text;
        else row.english = row.english ? `${row.english} ${text}` : text;
        pendingNumber = null;
        continue;
      }
      rows.push({number:`${rows.length + 1}.`, medicine:text, english:'', local:''});
      pendingNumber = null;
      continue;
    }
    const english = lines[index + 1] && !isNumberedMedicineLine(lines[index + 1]) ? lines[index + 1].replace(/^\d+[.)]\s*/, '') : '';
    const local = english && lines[index + 2] && !isNumberedMedicineLine(lines[index + 2]) ? lines[index + 2].replace(/^\d+[.)]\s*/, '') : '';
    rows.push({number:`${rows.length + 1}.`, medicine:medicineMatch[2], english, local});
    pendingNumber = null;
    if (english) index += 1;
    if (local) index += 1;
  }
  return rows.map(row => `
    <div class="rx-row">
      <div class="rx-number">${escapeHtml(row.number)}</div>
      <div class="rx-medicine">${escapeHtml(row.medicine)}</div>
      <div class="rx-instructions">
        ${row.english ? `<div>${escapeHtml(row.english)}</div>` : ''}
        ${includeMalayalam && row.local ? `<div>${escapeHtml(row.local)}</div>` : ''}
      </div>
    </div>
  `).join('');
}

function normalizedLayoutBlock(block, defaults){
  const size = ['small','medium','large'].includes(block?.size) ? block.size : defaults.size;
  return {
    text:String(block?.text ?? defaults.text ?? ''),
    enabled:block?.enabled === undefined ? defaults.enabled !== false : block.enabled !== false,
    bold:Boolean(block?.bold),
    italic:Boolean(block?.italic),
    size
  };
}

function prescriptionLayoutForNote(note){
  const saved = userProfiles[note?.userId]?.prescriptionLayout;
  return {
    includeMalayalam:saved?.includeMalayalam !== false,
    header:normalizedLayoutBlock(saved?.header, DEFAULT_PRESCRIPTION_LAYOUT.header),
    footer:normalizedLayoutBlock(saved?.footer, DEFAULT_PRESCRIPTION_LAYOUT.footer),
    signature:normalizedLayoutBlock(saved?.signature, DEFAULT_PRESCRIPTION_LAYOUT.signature)
  };
}

function layoutBlockClass(block){
  return [
    `layout-${block.size || 'medium'}`,
    block.bold ? 'layout-bold' : '',
    block.italic ? 'layout-italic' : ''
  ].filter(Boolean).join(' ');
}

function printBlockHtml(block, {firstLineStrong = false} = {}){
  const lines = String(block?.text || '').replace(/\r\n/g, '\n').split('\n');
  return lines.map((line, index) => {
    const escaped = escapeHtml(line);
    return firstLineStrong && index === 0 ? `<strong>${escaped}</strong>` : escaped;
  }).join('<br>');
}

function footerBlockHtml(block){
  const rawText = String(block?.text || '').replace(/\r\n/g, '\n').trim();
  const text = rawText.split(/\n+/).map(line => line.replace(/\s+/g, ' ').trim()).filter(Boolean).join(' ');
  if (!text) return '';
  const emergencyIndex = text.search(/\bEmergency\s+Contact\b/i);
  const displayLines = emergencyIndex > 0
    ? [text.slice(0, emergencyIndex).trim(), text.slice(emergencyIndex).trim()]
    : text.split(/\n+/).map(line => line.trim()).filter(Boolean);
  return displayLines.map(line => `<span class="rx-print-footer-line">${escapeHtml(line)}</span>`).join('');
}

function createPrintWindow(){
  const frame = document.createElement('iframe');
  frame.setAttribute('aria-hidden', 'true');
  frame.style.position = 'fixed';
  frame.style.right = '0';
  frame.style.bottom = '0';
  frame.style.width = '0';
  frame.style.height = '0';
  frame.style.border = '0';
  frame.style.opacity = '0';
  document.body.appendChild(frame);
  const frameWindow = frame.contentWindow;
  if (!frameWindow) return window.open('', '_blank');
  let cleaned = false;
  const cleanup = () => {
    if (cleaned) return;
    cleaned = true;
    setTimeout(() => frame.remove(), 500);
  };
  frameWindow.addEventListener('afterprint', cleanup, {once:true});
  return {
    document:frameWindow.document,
    focus:() => frameWindow.focus(),
    print:() => {
      frameWindow.focus();
      frameWindow.print();
    },
    close:() => setTimeout(cleanup, 2500)
  };
}

function noteMatchesSelectedScope(note, selectedDate = dateInputValue(selectedVisitDate)){
  return noteVisitType(note) === 'OP' && note.data?.visitDate === selectedDate;
}

function canToggleDischargeNote(note){
  return Boolean(note?.path && noteVisitType(note) === 'IP');
}

function updateDischargeButton(note){
  const canToggle = canToggleDischargeNote(note);
  const isDischarged = Boolean(note?.data?.dischargeDate);
  dischargeBtn.style.display = canToggle ? 'inline-flex' : 'none';
  dischargeBtn.classList.toggle('discharged', canToggle && isDischarged);
  dischargeBtn.textContent = isDischarged ? 'Discharged' : 'Discharge';
  dischargeBtn.setAttribute('aria-label', isDischarged ? 'Revert IP discharge' : 'Discharge IP patient');
  dischargeBtn.title = isDischarged ? 'Revert IP discharge' : 'Discharge IP patient';
}

function dateInputValue(date){
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function updateDateNavigation(){
  adminVisitDateInput.value = dateInputValue(selectedVisitDate);
  adminTodayBtn.textContent = new Date().toLocaleDateString('en-US',{weekday:'long'});
}

function setSelectedVisitDateFromValue(value){
  const [year,month,day] = String(value || '').split('-').map(Number);
  if (year && month && day) selectedVisitDate = new Date(year,month-1,day);
}

function moveAdminDate(days){
  adminDateTouched = true;
  const next = new Date(selectedVisitDate);
  next.setDate(next.getDate() + days);
  selectedVisitDate = next;
  selectedUserId = null;
  selectedNoteId = null;
  selectedTimelineEntryId = 'all';
  updateDateNavigation();
  render();
}

function visibleNotes(){
  const selectedDate = dateInputValue(selectedVisitDate);
  return allNotes.filter(note => note.data?.deleted !== true).filter(note => noteMatchesSelectedScope(note, selectedDate));
}

function noteSearchHaystack(note){
  const patient = note.data?.patientData || {};
  return [
    notePatientName(note),
    patient.uhid,
    note.data?.uhid,
    patient.age,
    patient.sex,
    userLabel(note.userId, 0),
    noteOwnerCode(note, userLabel(note.userId, 0))
  ].filter(Boolean).join(' ').toLowerCase();
}

function filteredVisibleNotes(){
  const query = adminSearchTerm.trim().toLowerCase();
  const notes = visibleNotes();
  if (!query) return notes;
  return notes.filter(note => noteSearchHaystack(note).includes(query));
}

function updateVisitToggle(){
  adminVisitToggle.querySelectorAll('[data-admin-visit-type]').forEach(button => {
    button.classList.toggle('active', button.dataset.adminVisitType === selectedVisitType);
  });
}

function compactVisitDateTime(note){
  const date = note.data?.visitDate ? note.data.visitDate.split('-').reverse().join('/') : '';
  const labelTime = String(note.data?.createdAtLabel || '').split(',').slice(1).join(',').trim();
  if (date && labelTime) return `${date} ${labelTime}`;
  return date || labelTime || '';
}

function noteMeta(note){
  const patient = note.data.patientData || {};
  const pieces = [];
  const dateTime = compactVisitDateTime(note);
  if (dateTime) pieces.push(dateTime);
  if (patient.uhid) pieces.push(`UHID ${patient.uhid}`);
  if (patient.age) pieces.push(cleanAge(patient.age));
  if (patient.sex) pieces.push(compactSex(patient.sex));
  return compactPatientMetaText(pieces.join(' · ') || note.userLabel);
}

function noteSubMeta(note){
  const mode = note.data?.selectedMode || note.data?.heading || 'Saved note';
  return compactPatientMetaText(mode);
}

function noteTime(note){
  return note.data.updatedAt?.toMillis?.()
    || note.data.createdAt?.toMillis?.()
    || note.data.createdAtValue?.toMillis?.()
    || 0;
}

function noteCreatedTime(note){
  return note.data.createdAt?.toMillis?.()
    || note.data.createdAtValue?.toMillis?.()
    || noteTime(note);
}

function isSavedNote(note){
  return note.data?.isDraft === false || note.data?.everSaved === true;
}

function isReviewedNote(note){
  return Boolean(note?.data?.adminCopiedAt);
}

function reviewedHeadingValue(value){
  return String(value || '').replace(/\s+draft$/i, '').trim();
}

function reviewedStatusPatch(note){
  const patch = {
    isDraft:false,
    everSaved:true,
    adminCopiedAt:serverTimestamp(),
    adminCopiedBy:currentAdminUid || ''
  };
  const selectedMode = reviewedHeadingValue(note?.data?.selectedMode);
  const heading = reviewedHeadingValue(note?.data?.heading);
  if (selectedMode) patch.selectedMode = selectedMode;
  if (heading) patch.heading = heading;
  return patch;
}

function hasUncopiedSavedNotes(userId){
  return visibleNotes().some(note => note.userId === userId && isSavedNote(note) && !isReviewedNote(note));
}

function userLabel(userId, index){
  return userProfiles[userId]?.credentialName || `User ${index + 1}`;
}

function allKnownUsers(){
  const ids = new Set([...scopedOwnerIds, ...allNotes.map(note => note.userId)]);
  return Array.from(ids)
    .filter(uid => uid && uid !== 'unknown')
    .sort()
    .map((uid, index) => ({uid, label:userLabel(uid, index)}));
}

function renderEntries(){
  entryList.innerHTML = '';
  const notes = filteredVisibleNotes();
  const totalCount = visibleNotes().length;
  notesLabel.textContent = adminSearchTerm.trim()
    ? `${notes.length} result${notes.length === 1 ? '' : 's'}`
    : `${totalCount} note${totalCount === 1 ? '' : 's'}`;
  notes.forEach((note, index) => {
    const button = document.createElement('button');
    const serialNumber = notes.length - index;
    button.className = [
      'entry',
      isSavedNote(note) && !isReviewedNote(note) ? 'uncopied' : '',
      note.id === selectedNoteId ? 'active' : ''
    ].filter(Boolean).join(' ');
    button.innerHTML = `
      <span class="entry-avatar">${escapeHtml(serialNumber)}</span>
      <span class="entry-text">
        <div class="entry-name">${escapeHtml(notePatientName(note))}</div>
        <div class="entry-meta">${escapeHtml(noteMeta(note))}</div>
        <div class="entry-submeta">${escapeHtml(noteSubMeta(note))}</div>

      <span class="entry-owner">${escapeHtml(noteOwnerCode(note, userLabel(note.userId, 0)))}</span>

    button.addEventListener('click', () => {

      <button class="timeline-item ${selectedTimelineEntryId === timelineEntryKey(note) ? 'active' : ''}" type="button" data-admin-timeline-entry="${escapeHtml(timelineEntryKey(note))}">

    const layout = prescriptionLayoutForNote(note);

        <h2 class="admin-all-entry-title">${escapeHtml(noteTimelineTitle(note))}</h2>

      </article>

function renderSelectedNote(){
  selectedVisitType = 'OP';
  const notes = filteredVisibleNotes();
  const dateNote = notes.find(item => item.id === selectedNoteId && item.userId === selectedUserId);
  const note = dateNote || selectedAdminNote();
  topbarTitle.textContent = 'Admin notes';
  topbarMeta.textContent = `${visibleNotes().length} note${visibleNotes().length === 1 ? '' : 's'} · ${users.length} mapped user${users.length === 1 ? '' : 's'}`;
  if (!visibleNotes().length){
    showEmpty('No notes', 'Notes from mapped users will appear here after they save them.');
    return;
  }
  if (!notes.length){
    showEmpty('No matches', 'No notes match this name or UHID search.');
    return;
  }
  if (!note || !notes.some(item => item.id === note.id && item.userId === note.userId)){
    selectedUserId = notes[0].userId;
    selectedNoteId = notes[0].id;
    selectedTimelineEntryId = 'all';
    renderSelectedNote();
    return;
  }
  const timelineNotes = orderedPatientTimelineNotes(note);
  const timelineNote = selectedTimelineEntryId === 'all'
    ? note
    : timelineNotes.find(item => timelineEntryKey(item) === selectedTimelineEntryId) || note;
  if (selectedTimelineEntryId !== 'all' && timelineEntryKey(timelineNote) !== selectedTimelineEntryId) selectedTimelineEntryId = 'all';

  const allReviewed = reviewTargets.length > 0 && reviewTargets.every(isReviewedNote);
  saveNoteBtn.textContent = allReviewed ? 'Reviewed' : 'Review';
  saveNoteBtn.classList.remove('copied');
  copyBtn.classList.remove('copied');
  copyBtn.textContent = 'Copy note';
  if (selectedTimelineEntryId === 'all'){

function adminAllEntryEditors(){
  return Array.from(document.querySelectorAll('[data-admin-all-entry-id][data-admin-all-entry-user]'));
}

function noteForAdminAllEntryEditor(editor){
  const id = editor?.dataset?.adminAllEntryId;
  const userId = editor?.dataset?.adminAllEntryUser;
  return allNotes.find(note => note.id === id && note.userId === userId) || null;
}

function selectedAdminCopyPayload(){
  const allEditors = adminAllEntryEditors();
  if (selectedTimelineEntryId === 'all' && allEditors.length){
    const payloads = allEditors
      .map(editor => adminClipboardPayloadForNote(noteForAdminAllEntryEditor(editor), editorPlainText(editor)))
      .filter(payload => payload.text);
    return {
      text: payloads.map(payload => payload.text).join('\n\n'),
      html: payloads.some(payload => payload.html)
        ? payloads.map(payload => payload.html || `<div>${escapeHtml(payload.text).replace(/\n/g, '<br>')}</div>`).join('<br><br>')
        : ''
    };
  }
  const note = selectedTimelineNote();
  const editor = document.getElementById('adminNoteEditor');
  return adminClipboardPayloadForNote(note, editorPlainText(editor) || note?.data?.transcription || '');
}

async function writeAdminClipboardPayload(payload){
  if (!payload?.text) return;
  if (payload.html && navigator.clipboard?.write && window.ClipboardItem){
    try{
      const item = new ClipboardItem({
        'text/html': new Blob([payload.html], {type:'text/html'}),
        'text/plain': new Blob([payload.text], {type:'text/plain'})
      });
      await navigator.clipboard.write([item]);
      return;
    }catch(error){}
  }
  await navigator.clipboard.writeText(payload.text);
}

function clearScopedSubscriptions(){
  profileUnsubscribes.forEach(unsubscribe => unsubscribe());
  noteUnsubscribes.forEach(unsubscribe => unsubscribe());
  profileUnsubscribes = [];
  noteUnsubscribes = [];
  scopedOwnerIds = [];
  allNotes = [];
  userProfiles = {};
}

function subscribeToAllNotes(){
  if (notesUnsubscribe) notesUnsubscribe();
  notesUnsubscribe = onSnapshot(collectionGroup(db,'notes'), snapshot => {
    allNotes = snapshot.docs.map(doc => {
      const userId = doc.ref.parent.parent?.id || 'unknown';
      return {
        id:doc.id,
        path:doc.ref.path,
        userId,
        userLabel:'',
        data:doc.data()
      };
    });
    render();
  }, error => {
    console.error(error);
    showEmpty('Unable to load notes', error.message || 'Check admin permissions and Firestore rules.');
  });
}

function subscribeToUserProfiles(){
  if (profilesUnsubscribe) profilesUnsubscribe();
  profilesUnsubscribe = onSnapshot(collection(db,'users'), snapshot => {
    userProfiles = Object.fromEntries(snapshot.docs.map(doc => [doc.id, doc.data()]));
    render();
  }, error => {
    console.error(error);
  });
}

function subscribeToScopedNotes(ownerIds){
  clearScopedSubscriptions();
  scopedOwnerIds = Array.from(new Set(ownerIds.filter(uid => typeof uid === 'string' && uid.trim())));
  if (!scopedOwnerIds.length){
    render();
    showEmpty('No group assigned', 'This admin login has not been assigned to a group in Master Admin.');
    return;
  }
  const notesByOwner = new Map();
  scopedOwnerIds.forEach(ownerId => {
    profileUnsubscribes.push(onSnapshot(doc(db,'users',ownerId), snapshot => {
      userProfiles[ownerId] = snapshot.data() || {};
      render();
    }, error => console.error(error)));
    noteUnsubscribes.push(onSnapshot(collection(db,'users',ownerId,'notes'), snapshot => {
      notesByOwner.set(ownerId, snapshot.docs.map(noteDoc => ({
        id:noteDoc.id,
        path:noteDoc.ref.path,
        userId:ownerId,
        userLabel:'',
        data:noteDoc.data()
      })));
      allNotes = Array.from(notesByOwner.values()).flat();
      render();
    }, error => {
      console.error(error);
      notesByOwner.set(ownerId, []);
      allNotes = Array.from(notesByOwner.values()).flat();
      render();
    }));
  });
}

onAuthStateChanged(auth, user => {
  if (notesUnsubscribe) notesUnsubscribe();
  if (profilesUnsubscribe) profilesUnsubscribe();
  clearScopedSubscriptions();
  notesUnsubscribe = null;
  profilesUnsubscribe = null;
  allNotes = [];
  userProfiles = {};
  selectedUserId = null;
  selectedNoteId = null;
  currentAdminUid = user?.uid || null;
  if (!user){
    appShell.classList.remove('authenticated');
    loginScreen.classList.remove('hidden');
    userEmail.textContent = '';
    return;
  }
  if (user.uid === MASTER_ADMIN_UID || String(user.email || '').toLowerCase() === MASTER_ADMIN_EMAIL){
    setDoc(doc(db,'users',user.uid),{
      email:user.email || '',
      emailUpdatedAt:serverTimestamp()
    },{merge:true}).catch(error => console.warn('Unable to update admin email:', error));
    loginScreen.classList.add('hidden');
    appShell.classList.add('authenticated');
    userEmail.textContent = user.email || '';
    safeLogActivity('admin_signed_in');
    updateDateNavigation();
    subscribeToUserProfiles();
    subscribeToAllNotes();
    return;
  }
  const profileRef = doc(db,'users',user.uid);
  setDoc(profileRef,{
    email:user.email || '',
    emailUpdatedAt:serverTimestamp()
  },{merge:true}).catch(error => {
    console.warn('Unable to update admin email:', error);
  }).then(() => getDoc(profileRef)).then(snapshot => {
    const profile = snapshot.data() || {};
    const ownerIds = Array.from(new Set([...(profile.sharedWith || []), ...(profile.adminSharedWith || [])]));
    const adminGroupIds = Array.isArray(profile.adminGroupIds) ? profile.adminGroupIds : [];
    if (!ownerIds.length && !adminGroupIds.length){
      appShell.classList.remove('authenticated');
      loginScreen.classList.remove('hidden');
      userEmail.textContent = '';
      loginError.innerHTML = `<div class="blocked">This account is not assigned to any admin group. Please add it in Master Admin.</div>`;
      return;
    }
    loginScreen.classList.add('hidden');
    appShell.classList.add('authenticated');
    userEmail.textContent = user.email || '';
    safeLogActivity('admin_signed_in');
    updateDateNavigation();
    subscribeToScopedNotes(ownerIds);
  }).catch(error => {
    console.error(error);
    appShell.classList.remove('authenticated');
    loginScreen.classList.remove('hidden');
    userEmail.textContent = '';
    loginError.innerHTML = `<div class="blocked">Unable to check admin access. Please try again.</div>`;
  });
});

saveNoteBtn.addEventListener('click', async () => {
  const note = selectedTimelineNote();
  const editor = document.getElementById('adminNoteEditor');
  const allEditors = adminAllEntryEditors();
  if (selectedTimelineEntryId === 'all' && !allEditors.length) return;
  if (selectedTimelineEntryId !== 'all' && (!note || !editor)) return;
  saveNoteBtn.disabled = true;
  saveNoteBtn.textContent = 'Reviewing...';
  try{
    if (selectedTimelineEntryId === 'all'){
      const editedNotes = [];
      await Promise.all(allEditors.map(item => {
        const entryNote = noteForAdminAllEntryEditor(item);
        if (!entryNote) return Promise.resolve();
        editedNotes.push(entryNote);
        const transcription = editorPlainText(item);
        const patientData = extractPatientFromNote(transcription, entryNote.data.patientData);
        entryNote.data.transcription = transcription;
        entryNote.data.patientData = patientData;
        entryNote.data.isDraft = false;
        entryNote.data.everSaved = true;
        entryNote.data.adminCopiedAt = new Date();
        entryNote.data.adminCopiedBy = currentAdminUid || '';
        const selectedMode = reviewedHeadingValue(entryNote.data.selectedMode);
        const heading = reviewedHeadingValue(entryNote.data.heading);
        if (selectedMode) entryNote.data.selectedMode = selectedMode;
        if (heading) entryNote.data.heading = heading;
        return updateDoc(doc(db,entryNote.path),{
          transcription,
          patientData,
          adminEditedAt:serverTimestamp(),
          adminEditedBy:currentAdminUid || '',
          ...reviewedStatusPatch(entryNote)
        });
      }));
      editedNotes.forEach(entryNote => {
        safeLogActivity('admin_note_edited', noteLogPayload(entryNote));
        safeLogActivity('admin_note_reviewed', noteLogPayload(entryNote));
      });
    }else{
      const transcription = editorPlainText(editor);
      const patientData = extractPatientFromNote(transcription, note.data.patientData);
      note.data.transcription = transcription;
      note.data.patientData = patientData;
      note.data.isDraft = false;
      note.data.everSaved = true;
      note.data.adminCopiedAt = new Date();
      note.data.adminCopiedBy = currentAdminUid || '';
      const selectedMode = reviewedHeadingValue(note.data.selectedMode);
      const heading = reviewedHeadingValue(note.data.heading);
      if (selectedMode) note.data.selectedMode = selectedMode;
      if (heading) note.data.heading = heading;
      await updateDoc(doc(db,note.path),{
        transcription,
        patientData,
        adminEditedAt:serverTimestamp(),
        adminEditedBy:currentAdminUid || '',
        ...reviewedStatusPatch(note)
      });
      safeLogActivity('admin_note_edited', noteLogPayload(note));
      safeLogActivity('admin_note_reviewed', noteLogPayload(note));
    }
    renderEntries();
    renderAdminTimelineMenu();
    saveNoteBtn.textContent = 'Reviewed';
    saveNoteBtn.classList.add('copied');
    setTimeout(() => {
      saveNoteBtn.textContent = 'Reviewed';
      saveNoteBtn.classList.remove('copied');
      saveNoteBtn.disabled = false;
    }, 1200);
  }catch(error){
    console.error(error);
    saveNoteBtn.textContent = 'Try again';
    saveNoteBtn.disabled = false;
  }
});

  if (!adminSettingsMenu.contains(event.target) && event.target !== adminSettingsBtn){
    closeAdminSettings();
  }
  if (!adminPrintMenu.contains(event.target) && event.target !== adminPrintMenuBtn){
    closeAdminPrintMenu();
  }
  if (!adminTimelineMenu.contains(event.target) && event.target !== adminTimelineBtn){
    closeAdminTimelineMenu();
  }
});

signoutBtn.addEventListener('click', () => signOut(auth));
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    let refreshingForUpdate = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshingForUpdate) return;
      refreshingForUpdate = true;
      window.location.reload();
    });
    navigator.serviceWorker.register('./sw.js?v=169', {updateViaCache:'none'}).then(registration => {
      registration.update();
    }).catch(error => {
      console.warn('Service worker registration failed:', error);
    });
  });
}
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOYZ Activity Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181F;
    --muted:#747B87;
    --soft:#A0A7B2;
    --teal:#1F6B59;
    --teal-dark:#155446;
    --teal-wash:#E9F4EF;
    --blue:#4678F5;
    --amber:#C77710;
    --amber-wash:#FFF7E7;
    --red:#EC4A55;
    --red-wash:#FDEBEC;
    --border:#E4E0D8;
    --paper:#F7F5F0;
    --card:#FFFEFC;
    --shadow:0 22px 50px -42px rgba(21,28,38,.45);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; overflow-x:hidden; color:var(--ink); background:var(--paper); font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  button,input{ font:inherit; }
  button{ cursor:pointer; }
  .login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px; background:linear-gradient(145deg,#F7F5F0,#EAF2EF); }
  .login-screen.hidden{ display:none; }
  .login-card{ width:min(420px,100%); background:#fff; border:1px solid var(--border); border-radius:22px; padding:34px; box-shadow:var(--shadow); }
  .brand{ display:flex; align-items:center; gap:9px; font-size:23px; font-weight:900; }
  .brand-pill{ display:inline-flex; align-items:center; gap:8px; padding:6px 13px 6px 8px; border:4px solid #F45155; border-radius:999px; background:#17171D; color:#fff; letter-spacing:1px; }
  .brand-dot{ width:23px; height:23px; border-radius:50%; background:#F45155; border:6px solid #452126; }
  h1{ margin:0; font:900 43px/1 'Inter',system-ui,sans-serif; letter-spacing:-.04em; }
  .login-card h1{ font:700 28px/1.1 'Fraunces',serif; letter-spacing:0; margin-top:26px; }
  .sub{ margin:9px 0 0; color:var(--muted); font-size:16px; font-weight:600; }
  .live-dot{ display:inline-flex; align-items:center; gap:5px; color:#279A65; font-weight:900; }
  .live-dot::before{ content:''; width:9px; height:9px; border-radius:50%; background:#33B374; box-shadow:0 0 0 4px rgba(51,179,116,.14); }
  label{ display:block; margin:14px 0 7px; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  input{ width:100%; height:44px; border:1.5px solid var(--border); border-radius:11px; padding:0 13px; outline:none; background:#fff; color:var(--ink); }
  input:focus{ border-color:#AEBBB4; box-shadow:0 0 0 3px rgba(31,107,89,.13); }
  .btn{ min-height:40px; border:1.5px solid var(--border); border-radius:12px; background:#fff; color:var(--ink); padding:0 16px; font-weight:900; }
  .btn.primary{ width:100%; margin-top:22px; background:var(--teal); border-color:var(--teal); color:#fff; }
  .btn.dark{ background:#12161E; border-color:#12161E; color:#fff; }
  .btn.ghost:hover{ background:var(--teal-wash); border-color:#BFD0C8; color:var(--teal-dark); }
  .error{ min-height:18px; margin-top:12px; color:var(--red); font-size:12px; }
  .app{ display:none; min-height:100vh; }
  .app.authenticated{ display:grid; grid-template-columns:250px minmax(0,1fr); }
  .sidebar{ min-height:100vh; background:#fff; border-right:1px solid var(--border); padding:22px 18px; display:flex; flex-direction:column; gap:22px; position:sticky; top:0; }
  .sidebar .brand-pill{ font-size:19px; padding:6px 13px 6px 8px; }
  .search-wrap{ position:relative; }
  .search-wrap::before{ content:''; position:absolute; left:18px; top:50%; width:13px; height:13px; border:2px solid var(--soft); border-radius:50%; transform:translateY(-50%); }
  .search-wrap::after{ content:''; position:absolute; left:31px; top:29px; width:8px; height:2px; border-radius:999px; background:var(--soft); transform:rotate(45deg); }
  .search-wrap input{ height:42px; border-radius:13px; padding-left:42px; padding-right:48px; font-size:14px; }
  .shortcut{ position:absolute; right:14px; top:50%; transform:translateY(-50%); min-width:31px; height:24px; border:1px solid var(--border); border-radius:8px; display:grid; place-items:center; color:var(--soft); font:800 11px 'IBM Plex Mono',monospace; }
  .side-section{ display:grid; gap:8px; }
  .side-title{ color:#9299A4; font:900 12px 'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.14em; margin-bottom:3px; }
  .stream-btn,.quick-btn{ width:100%; min-height:38px; border:0; border-radius:10px; background:transparent; display:grid; grid-template-columns:18px 1fr auto; align-items:center; gap:7px; padding:0 11px; text-align:left; color:#303743; font-weight:900; font-size:15px; }
  .stream-btn:hover,.quick-btn:hover{ background:#F4F2EE; }
  .stream-btn.active{ background:var(--teal); color:#fff; }
  .note-subfilters{ display:none; gap:6px; padding:0 0 2px 24px; }
  .note-subfilters.visible{ display:grid; }
  .note-filter-btn{ width:100%; min-height:31px; border:0; border-radius:9px; background:transparent; display:grid; grid-template-columns:1fr auto; align-items:center; gap:7px; padding:0 8px 0 10px; text-align:left; color:#4B535F; font-weight:900; font-size:13px; }
  .note-filter-btn:hover{ background:#F4F2EE; }
  .note-filter-btn.active{ background:#FFF3DA; color:#A7680F; }
  .note-filter-btn .pill-count{ min-width:26px; height:20px; font-size:12px; }
  .stream-dot{ width:9px; height:9px; border-radius:50%; background:#14181F; }
  .stream-btn[data-tab="users"] .stream-dot{ background:var(--blue); }
  .stream-btn[data-tab="notes"] .stream-dot{ background:var(--amber); }
  .stream-btn[data-tab="admin"] .stream-dot{ background:#80D4AC; }
  .stream-btn[data-tab="master"] .stream-dot{ background:var(--red); }
  .stream-btn[data-tab="gemini"] .stream-dot{ background:#8B5CF6; }
  .pill-count{ min-width:30px; height:22px; border-radius:999px; display:grid; place-items:center; background:#ECEAE4; color:#7B817D; font-size:13px; font-weight:900; }
  .stream-btn.active .pill-count{ background:rgba(255,255,255,.2); color:#fff; }
  .quick-btn{ grid-template-columns:1fr auto; min-height:36px; padding:0 11px 0 13px; }
  .quick-btn.active{ background:#151920; color:#fff; }
  .sidebar-foot{ margin-top:auto; border-top:1px solid var(--border); padding-top:20px; display:flex; align-items:center; gap:12px; }
  .avatar{ width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:var(--teal); color:#fff; font-weight:900; flex:0 0 auto; font-size:14px; }
  .user-lines{ min-width:0; }
  .user-lines strong{ display:block; font-size:17px; }
  .user-lines span{ display:block; color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:130px; }
  .signout-link{ margin-left:auto; border:0; background:transparent; color:var(--red); font-weight:900; }
  .content{ min-width:0; max-width:100%; overflow:hidden; padding:26px 28px 30px; }
  .hero{ display:grid; grid-template-columns:minmax(230px,1fr) auto; gap:14px; align-items:start; margin-bottom:18px; }
  .toolbar{ display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:8px; padding-top:14px; }
  .range-tabs{ min-height:40px; border:1px solid var(--border); border-radius:12px; background:#fff; display:flex; align-items:center; padding:3px; }
  .range-btn{ height:32px; border:0; border-radius:9px; padding:0 14px; background:transparent; color:#636B76; font-weight:900; font-size:14px; }
  .range-btn.active{ background:#14181F; color:#fff; }
  .date-nav{ display:flex; align-items:center; gap:8px; }
  .date-step{ width:40px; height:40px; border:1.5px solid var(--border); border-radius:11px; background:#fff; color:#16263A; font-size:21px; line-height:1; font-weight:900; display:grid; place-items:center; }
  .date-step:hover{ background:#F0EEE8; }
  .date-input-wrap{ position:relative; display:block; }
  .date-label{ min-width:190px; height:40px; border:1.5px solid var(--border); border-radius:11px; background:#fff; display:flex; align-items:center; justify-content:center; gap:10px; padding:0 36px 0 16px; font-weight:900; font-size:14px; }
  .date-input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .calendar-mark{ position:absolute; right:15px; top:50%; width:18px; height:17px; border:2px solid #111821; border-radius:4px; transform:translateY(-50%); pointer-events:none; }
  .calendar-mark::before{ content:''; position:absolute; left:2px; right:2px; top:4px; height:2px; background:#111821; border-radius:999px; }
  .summary-grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:18px; }
  .stat-card,.panel{ background:var(--card); border:1px solid var(--border); border-radius:15px; box-shadow:var(--shadow); }
  .stat-card{ min-width:0; min-height:94px; padding:17px 18px; display:grid; gap:5px; overflow:hidden; }
  .label{ color:#9299A4; font:900 12px 'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.13em; }
  .stat-number{ font-size:34px; line-height:.95; font-weight:900; letter-spacing:-.04em; }
  .stat-sub{ color:var(--muted); font-size:13px; font-weight:600; }
  .hour-bars{ height:42px; max-width:100%; overflow:hidden; display:flex; align-items:end; gap:5px; margin-top:16px; }
  .hour-bar{ flex:1 1 0; min-width:0; height:5px; border-radius:999px; background:#DFECE7; }
  .hour-bar.strong{ background:var(--teal); }
  .dashboard{ min-width:0; display:grid; grid-template-columns:minmax(0,1fr); gap:16px; align-items:start; }
  .dashboard.gemini-mode{ grid-template-columns:minmax(0,1fr); }
  .timeline-panel{ min-height:560px; overflow:hidden; }
  .panel-head{ min-height:48px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 18px; border-bottom:1px solid var(--border); }
  .panel-title{ font-size:19px; font-weight:900; letter-spacing:-.02em; }
  .panel-note{ color:#9299A4; font-weight:700; font-size:13px; }
  .timeline{ display:grid; }
  .hour-group{ border-bottom:1px solid #ECE8E1; }
  .hour-label{ min-height:30px; display:flex; align-items:center; gap:10px; background:#FBFAF7; border-bottom:1px solid #EEEAE3; padding:0 18px; color:#8A929D; font:900 12px 'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.08em; }
  .event-row{ display:grid; grid-template-columns:84px 28px 1fr auto; gap:12px; align-items:center; min-height:62px; padding:9px 18px; position:relative; }
  .event-row::before{ content:''; position:absolute; left:111px; top:0; bottom:0; width:2px; background:#EAE6DE; }
  .event-time{ color:#27303C; font:900 13px 'IBM Plex Mono',monospace; white-space:nowrap; }
  .node{ width:15px; height:15px; border-radius:50%; border:4px solid currentColor; background:#fff; color:var(--teal); z-index:1; box-shadow:0 0 0 4px #fff; }
  .event-avatar{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--teal); color:#fff; font-weight:900; font-size:13px; }
  .event-copy{ min-width:0; display:grid; grid-template-columns:34px minmax(0,1fr); gap:12px; align-items:center; }
  .event-main{ min-width:0; }
  .event-main strong{ font-size:15px; letter-spacing:-.01em; }
  .event-main span{ color:#8B929D; font-weight:600; }
  .event-meta{ margin-top:1px; color:#8B929D; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .event-badge{ min-width:64px; min-height:27px; border-radius:9px; display:grid; place-items:center; padding:0 10px; background:#E7F3ED; color:var(--teal); font-weight:900; font-size:11px; text-transform:uppercase; }
  .event-badge.master{ background:var(--red-wash); color:#CF3642; }
  .event-badge.notes{ background:#FFF3DA; color:#A7680F; }
  .event-badge.users{ background:#EAF0FF; color:#315FCC; }
  .event-badge.gemini{ background:#F0EAFE; color:#6D3BD6; }
  .empty{ margin:30px; padding:28px; background:#fff; border:1px dashed var(--border); border-radius:14px; color:var(--muted); font-weight:800; text-align:center; }
  .gemini-table-wrap{ width:100%; max-width:100%; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; scrollbar-gutter:stable; }
  .gemini-table{ width:100%; min-width:1120px; border-collapse:collapse; table-layout:fixed; }
  .activity-table{ min-width:1040px; }
  .gemini-table th,.gemini-table td{ border-bottom:1px solid #ECE8E1; padding:10px 12px; text-align:left; vertical-align:top; font-size:13px; }
  .gemini-table th{ color:#9299A4; font:900 11px 'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.08em; background:#FBFAF7; }
  .gemini-table td{ color:#303743; font-weight:700; overflow:hidden; text-overflow:ellipsis; }
  .gemini-time{ width:82px; white-space:nowrap; font-family:'IBM Plex Mono',monospace; font-weight:900; }
  .gemini-user{ width:150px; }
  .gemini-action{ width:170px; }
  .gemini-patient{ width:160px; }
  .gemini-uhid{ width:115px; }
  .gemini-type{ width:100px; }
  .gemini-duration{ width:95px; }
  .gemini-model{ width:145px; }
  .gemini-attempt{ width:80px; }
  .gemini-doctor{ width:155px; }
  .gemini-page{ width:90px; }
  @media (max-width:1200px){
    .app.authenticated{ grid-template-columns:270px minmax(0,1fr); }
    .summary-grid{ grid-template-columns:repeat(2,minmax(160px,1fr)); }
    .dashboard{ grid-template-columns:1fr; }
  }
  @media (max-width:850px){
    .app.authenticated{ grid-template-columns:1fr; }
    .sidebar{ position:static; min-height:auto; }
    .content{ padding:24px 18px; }
    .hero{ grid-template-columns:1fr; }
    h1{ font-size:40px; }
    .toolbar{ justify-content:flex-start; padding-top:0; }
    .summary-grid{ grid-template-columns:1fr; }
    .event-row{ grid-template-columns:76px 28px 1fr; }
    .event-row::before{ left:111px; }
    .event-badge{ grid-column:3; justify-self:start; }
    .gemini-table{ min-width:980px; }
    .activity-table{ min-width:1080px; }
  }
</style>
</head>
<body>
<section class="login-screen" id="loginScreen">
  <form class="login-card" id="loginForm">
    <div class="brand"><span class="brand-pill"><span class="brand-dot"></span>WOYZ</span><span>Log</span></div>
    <h1>Activity log</h1>
    <p class="sub">Activity log admin access only.</p>
    <label for="loginEmail">Email address</label>
    <input id="loginEmail" type="email" autocomplete="username" required>
    <label for="loginPassword">Password</label>
    <input id="loginPassword" type="password" autocomplete="current-password" required>
    <button class="btn primary" id="loginSubmit" type="submit">Sign in</button>
    <div class="error" id="loginError" role="alert"></div>
  </form>
</section>

<div class="app" id="appShell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-pill"><span class="brand-dot"></span>WOYZ</span><span>Log</span></div>
    <div class="search-wrap">
      <input id="searchInput" type="search" autocomplete="off" placeholder="Search user, UHID...">
      <span class="shortcut">/</span>
    </div>
    <div class="side-section">
      <div class="side-title">Streams</div>
      <button class="stream-btn active" type="button" data-tab="all"><span class="stream-dot"></span><span>All activity</span><span class="pill-count" id="countAll">0</span></button>
      <button class="stream-btn" type="button" data-tab="users"><span class="stream-dot"></span><span>Users</span><span class="pill-count" id="countUsers">0</span></button>
      <button class="stream-btn" type="button" data-tab="notes"><span class="stream-dot"></span><span>Notes</span><span class="pill-count" id="countNotes">0</span></button>
      <div class="note-subfilters" id="noteSubfilters" aria-label="Note activity filters">
        <button class="note-filter-btn active" type="button" data-note-filter="all"><span>All notes</span><span class="pill-count" id="countNoteAll">0</span></button>
        <button class="note-filter-btn" type="button" data-note-filter="visit"><span>Visit note</span><span class="pill-count" id="countNoteVisit">0</span></button>
        <button class="note-filter-btn" type="button" data-note-filter="discharge"><span>Discharge</span><span class="pill-count" id="countNoteDischarge">0</span></button>
        <button class="note-filter-btn" type="button" data-note-filter="addon"><span>Add on</span><span class="pill-count" id="countNoteAddon">0</span></button>
      </div>
      <button class="stream-btn" type="button" data-tab="admin"><span class="stream-dot"></span><span>Admin</span><span class="pill-count" id="countAdmin">0</span></button>
      <button class="stream-btn" type="button" data-tab="master"><span class="stream-dot"></span><span>Master</span><span class="pill-count" id="countMaster">0</span></button>
      <button class="stream-btn" type="button" data-tab="gemini"><span class="stream-dot"></span><span>Gemini API use</span><span class="pill-count" id="countGemini">0</span></button>
    </div>
    <div class="side-section">
      <div class="side-title">Quick filters</div>
      <button class="quick-btn" type="button" data-quick="signins"><span>Sign-ins only</span><span class="pill-count" id="countSignins">0</span></button>
      <button class="quick-btn" type="button" data-quick="failed"><span>Failed attempts</span><span class="pill-count" id="countFailed">0</span></button>
      <button class="quick-btn" type="button" data-quick="last60"><span>Last 60 minutes</span><span class="pill-count" id="countLast60">0</span></button>
    </div>
    <div class="sidebar-foot">
      <div class="avatar" id="footerAvatar">DG</div>
      <div class="user-lines"><strong>Log Admin</strong><span id="userEmail"></span></div>
      <button class="signout-link" id="signoutBtn" type="button">Sign out</button>
    </div>
  </aside>
  <main class="content">
    <section class="hero">
      <div>
        <h1>Activity log</h1>
        <p class="sub">Aster ED / Admin stream <span class="live-dot">Live</span></p>
      </div>
      <div class="toolbar">
        <div class="range-tabs" aria-label="Date range">
          <button class="range-btn" type="button" data-range="yesterday">Yesterday</button>
          <button class="range-btn active" type="button" data-range="today">Today</button>
          <button class="range-btn" type="button" data-range="7days">7 days</button>
        </div>
        <div class="date-nav" aria-label="Activity log date">
          <button class="date-step" id="previousDateBtn" type="button" aria-label="Previous date">&lsaquo;</button>
          <span class="date-input-wrap">
            <span class="date-label" id="dateLabel">Today</span>
            <span class="calendar-mark"></span>
            <input class="date-input" id="dateInput" type="date" aria-label="Filter by date">
          </span>
          <button class="date-step" id="nextDateBtn" type="button" aria-label="Next date">&rsaquo;</button>
        </div>
        <button class="btn dark" id="refreshBtn" type="button">Refresh</button>
      </div>
    </section>

    <section class="summary-grid" aria-label="Activity summary">
      <article class="stat-card"><div class="label">Events today</div><div class="stat-number" id="eventsToday">0</div><div class="stat-sub" id="eventsSub">All in Admin stream</div></article>
      <article class="stat-card"><div class="label">Unique users</div><div class="stat-number" id="uniqueUsers">0</div><div class="stat-sub" id="uniqueSub">No users yet</div></article>
      <article class="stat-card"><div class="label">Last activity</div><div class="stat-number" id="lastActivity">--</div><div class="stat-sub" id="lastActivitySub">No activity</div></article>
      <article class="stat-card"><div class="label">By hour</div><div class="hour-bars" id="hourBars"></div></article>
    </section>

    <section class="dashboard" id="dashboardGrid">
      <article class="panel timeline-panel">
        <div class="panel-head"><div class="panel-title">Timeline</div><div class="panel-note">Newest first / duplicates grouped</div></div>
        <div class="timeline" id="logList"></div>
      </article>
    </section>
  </main>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
import { browserLocalPersistence, getAuth, onAuthStateChanged, setPersistence, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
import { getFirestore, collection, limit, onSnapshot, orderBy, query } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';
import { firebaseConfig } from './firebase-config.js';

const LOG_ADMIN_EMAIL = 'aster-admin@woyz.in';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
setPersistence(auth, browserLocalPersistence).catch(error => console.warn('Unable to enable persistent login:', error));

const loginScreen = document.getElementById('loginScreen');
const loginForm = document.getElementById('loginForm');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const loginSubmit = document.getElementById('loginSubmit');
const loginError = document.getElementById('loginError');
const appShell = document.getElementById('appShell');
const userEmail = document.getElementById('userEmail');
const footerAvatar = document.getElementById('footerAvatar');
const searchInput = document.getElementById('searchInput');
const dateInput = document.getElementById('dateInput');
const dateLabel = document.getElementById('dateLabel');
const previousDateBtn = document.getElementById('previousDateBtn');
const nextDateBtn = document.getElementById('nextDateBtn');
const refreshBtn = document.getElementById('refreshBtn');
const signoutBtn = document.getElementById('signoutBtn');
const logList = document.getElementById('logList');
const dashboardGrid = document.getElementById('dashboardGrid');
const hourBars = document.getElementById('hourBars');
const streamButtons = Array.from(document.querySelectorAll('.stream-btn'));
const noteSubfilters = document.getElementById('noteSubfilters');
const noteFilterButtons = Array.from(document.querySelectorAll('.note-filter-btn'));
const quickButtons = Array.from(document.querySelectorAll('.quick-btn'));
const rangeButtons = Array.from(document.querySelectorAll('.range-btn'));
const countEls = {
  all:document.getElementById('countAll'),
  users:document.getElementById('countUsers'),
  notes:document.getElementById('countNotes'),
  admin:document.getElementById('countAdmin'),
  master:document.getElementById('countMaster'),
  gemini:document.getElementById('countGemini'),
  signins:document.getElementById('countSignins'),
  failed:document.getElementById('countFailed'),
  last60:document.getElementById('countLast60')
};
const noteCountEls = {
  all:document.getElementById('countNoteAll'),
  visit:document.getElementById('countNoteVisit'),
  discharge:document.getElementById('countNoteDischarge'),
  addon:document.getElementById('countNoteAddon')
};
const statEls = {
  eventsToday:document.getElementById('eventsToday'),
  eventsSub:document.getElementById('eventsSub'),
  uniqueUsers:document.getElementById('uniqueUsers'),
  uniqueSub:document.getElementById('uniqueSub'),
  lastActivity:document.getElementById('lastActivity'),
  lastActivitySub:document.getElementById('lastActivitySub')
};

let unsubscribeLogs = null;
let unsubscribeUsers = null;
let logs = [];
let userProfiles = new Map();
let searchTerm = '';
let selectedDate = dateInputValue(new Date());
let selectedRange = 'today';
let selectedActivityTab = 'all';
let selectedNoteFilter = 'all';
let selectedQuickFilter = '';

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
}

function titleCaseAction(action){
  return String(action || 'activity').replace(/[_-]+/g, ' ').replace(/\b\w/g, char => char.toUpperCase());
}

function dateInputValue(date){
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function dateFromInputValue(value){
  const parts = String(value || '').split('-').map(Number);
  if (parts.length !== 3 || parts.some(part => !Number.isFinite(part))) return new Date();
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

function logDate(log){
  return log.createdAt?.toDate?.() || null;
}

function dateKey(value){
  const date = value?.toDate?.() || null;
  return date ? dateInputValue(date) : '';
}

function prettyDate(value){
  return dateFromInputValue(value).toLocaleDateString('en-IN', {weekday:'short', day:'2-digit', month:'short', year:'numeric'});
}

function timeText(date){
  if (!date) return '--';
  return date.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', hour12:true}).replace('am','AM').replace('pm','PM');
}

function hourKey(date){
  if (!date) return '';
  return date.toLocaleTimeString('en-IN', {hour:'numeric', hour12:true}).replace('am','AM').replace('pm','PM');
}

function initials(value){
  const source = String(value || 'User').replace(/@.*/, '').replace(/[^a-z0-9 ]/gi, ' ').trim();
  const parts = source.split(/\s+/).filter(Boolean);
  if (!parts.length) return 'U';
  return parts.slice(0, 2).map(part => part[0]).join('').toUpperCase();
}

function logCredentialName(log){
  return log.credentialName || userProfiles.get(log.userId)?.credentialName || '';
}

function logDoctorCredential(log){
  const profile = userProfiles.get(log.userId) || {};
  const name = profile.doctorCredentialName || log.doctorCredentialName || '';
  const employeeId = profile.doctorCredentialEmployeeId || log.doctorCredentialEmployeeId || '';
  return name && employeeId ? `${name} (${employeeId})` : 'NIL';
}

function logHaystack(log){
  return [log.action, log.page, log.email, logCredentialName(log), logDoctorCredential(log), log.userId, log.noteId, log.noteOwnerUid, log.noteType, log.patientName, log.uhid, log.visitDate, log.visitType, log.geminiModel, log.recordingDuration, log.geminiAttempts].filter(Boolean).join(' ').toLowerCase();
}

function logActor(log){
  return logCredentialName(log) || log.email || log.userId || 'Unknown user';
}

function logActorDetail(log){
  const items = [];
  const credentialName = logCredentialName(log);
  if (credentialName) items.push(`credential: ${credentialName}`);
  if (log.email) items.push(log.email);
  if (log.page) items.push(`page: ${log.page}`);
  items.push(`doctor: ${logDoctorCredential(log)}`);
  return items.join(' / ') || 'activity stream';
}

function categoryForLog(log){
  const action = String(log.action || '').toLowerCase();
  const page = String(log.page || '').toLowerCase();
  if (page === 'master-admin' || page === 'master' || action.includes('master') || action.includes('mapped') || action.includes('group')) return 'master';
  if (page === 'index' || action.startsWith('admin') || action.includes('emr') || action.includes('ip_')) return 'admin';
  if (/note|draft|add_on|addon|discharge|copied|printed|saved|deleted|template/.test(action)) return 'notes';
  if (page === 'user' || action.includes('signed_in') || action.includes('signed_out')) return 'users';
  return 'admin';
}

function isGeminiApiLog(log){
  const haystack = logHaystack(log);
  return /gemini|generativelanguage|google ai|api use|api_usage|generatecontent|voice_note_generated|discharge_summary_generated|add_on_completed/.test(haystack);
}

function noteActivityType(log){
  const action = String(log.action || '').toLowerCase();
  const noteType = String(log.noteType || '').toLowerCase();
  const haystack = logHaystack(log);
  if (/add_on|addon/.test(action) || /add on/.test(haystack)) return 'addon';
  if (action.includes('discharge_summary') || noteType.includes('discharge') || haystack.includes('discharge summary')) return 'discharge';
  return 'visit';
}

function technicalLogMeta(log){
  const items = [];
  if (log.recordingDuration) items.push(`recording: ${log.recordingDuration}`);
  if (log.geminiModel) items.push(`model: ${log.geminiModel}`);
  if (log.geminiAttempts) items.push(`attempt: ${log.geminiAttempts}`);
  return items.length ? ` / ${items.join(' / ')}` : '';
}

function geminiValue(value){
  const cleaned = String(value ?? '').replace(/\s+/g, ' ').trim();
  return cleaned || '--';
}

function geminiDuration(log){
  const value = log.recordingDuration;
  if (typeof value === 'number') return `${value}s`;
  return geminiValue(value);
}

function geminiAttempts(log){
  const value = log.geminiAttempts;
  if (value === 0) return '0';
  return geminiValue(value);
}

function logMatchesRange(log){
  const date = logDate(log);
  if (!date) return false;
  if (selectedRange === '7days'){
    const end = new Date(dateFromInputValue(selectedDate));
    end.setHours(23, 59, 59, 999);
    const start = new Date(end);
    start.setDate(start.getDate() - 6);
    start.setHours(0, 0, 0, 0);
    return date >= start && date <= end;
  }
  return dateKey(log.createdAt) === selectedDate;
}

function logMatchesQuickFilter(log){
  if (!selectedQuickFilter) return true;
  const action = String(log.action || '').toLowerCase();
  if (selectedQuickFilter === 'signins') return action.includes('signed_in') || action.includes('sign');
  if (selectedQuickFilter === 'failed') return action.includes('failed') || action.includes('denied') || action.includes('error');
  if (selectedQuickFilter === 'last60'){
    const date = logDate(log);
    return date && Date.now() - date.getTime() <= 60 * 60 * 1000;
  }
  return true;
}

function baseDateLogs(){
  return logs.filter(logMatchesRange);
}

function filteredLogs(){
  const term = searchTerm.trim().toLowerCase();
  return baseDateLogs().filter(log => {
    if (selectedActivityTab === 'gemini' && !isGeminiApiLog(log)) return false;
    if (selectedActivityTab !== 'all' && selectedActivityTab !== 'gemini' && categoryForLog(log) !== selectedActivityTab) return false;
    if (selectedActivityTab === 'notes' && selectedNoteFilter !== 'all' && noteActivityType(log) !== selectedNoteFilter) return false;
    if (!logMatchesQuickFilter(log)) return false;
    if (term && !logHaystack(log).includes(term)) return false;
    return true;
  });
}

function sameActionText(log){
  const action = titleCaseAction(log.action);
  if (String(log.action || '').toLowerCase().includes('signed_in')) return 'Signed in';
  if (String(log.action || '').toLowerCase().includes('signed_out')) return 'Signed out';
  return action;
}

function actionTarget(log){
  if (log.patientName) return log.patientName;
  return log.page ? `${log.page} console` : 'activity stream';
}

function updateDateControls(){
  dateInput.value = selectedDate;
  dateLabel.textContent = prettyDate(selectedDate);
  rangeButtons.forEach(button => button.classList.toggle('active', button.dataset.range === selectedRange));
}

function setSelectedDate(value, range = 'today'){
  selectedDate = value;
  selectedRange = range;
  updateDateControls();
  render();
}

function moveSelectedDate(days){
  const date = dateFromInputValue(selectedDate);
  date.setDate(date.getDate() + days);
  setSelectedDate(dateInputValue(date), selectedRange === '7days' ? '7days' : 'today');
}

function updateCounts(dateLogs){
  const counts = {all:dateLogs.length, users:0, notes:0, admin:0, master:0, gemini:0, signins:0, failed:0, last60:0};
  const noteCounts = {all:0, visit:0, discharge:0, addon:0};
  dateLogs.forEach(log => {
    const category = categoryForLog(log);
    counts[category] += 1;
    if (category === 'notes'){
      const noteType = noteActivityType(log);
      noteCounts.all += 1;
      noteCounts[noteType] += 1;
    }
    if (isGeminiApiLog(log)) counts.gemini += 1;
    const action = String(log.action || '').toLowerCase();
    if (action.includes('signed_in') || action.includes('sign')) counts.signins += 1;
    if (action.includes('failed') || action.includes('denied') || action.includes('error')) counts.failed += 1;
    const date = logDate(log);
    if (date && Date.now() - date.getTime() <= 60 * 60 * 1000) counts.last60 += 1;
  });
  Object.entries(countEls).forEach(([key, el]) => {
    el.textContent = String(counts[key] || 0);
  });
  Object.entries(noteCountEls).forEach(([key, el]) => {
    el.textContent = String(noteCounts[key] || 0);
  });
}

function updateStats(visible, dateLogs){
  const userMap = new Map();
  dateLogs.forEach(log => userMap.set(logActor(log), true));
  const last = visible[0] || dateLogs[0];
  const lastDate = last ? logDate(last) : null;
  statEls.eventsToday.textContent = String(visible.length);
  statEls.eventsSub.textContent = selectedActivityTab === 'all'
    ? 'All in Admin stream'
    : `${selectedActivityTab === 'notes' && selectedNoteFilter !== 'all' ? titleCaseAction(selectedNoteFilter) : selectedActivityTab === 'gemini' ? 'Gemini API use' : titleCaseAction(selectedActivityTab)} stream`;
  statEls.uniqueUsers.textContent = String(userMap.size);
  statEls.uniqueSub.textContent = Array.from(userMap.keys()).slice(0, 2).map(value => value.replace(/@.*/, '')).join(' / ') || 'No users yet';
  statEls.lastActivity.textContent = lastDate ? timeText(lastDate).replace(/\s/g, ' ') : '--';
  statEls.lastActivitySub.textContent = last ? `${sameActionText(last)} / ${last.page || 'log'}` : 'No activity';
}

function updateHourBars(dateLogs){
  const counts = Array(24).fill(0);
  dateLogs.forEach(log => {
    const date = logDate(log);
    if (date) counts[date.getHours()] += 1;
  });
  const max = Math.max(...counts, 1);
  hourBars.innerHTML = counts.map(count => {
    const height = Math.max(5, Math.round((count / max) * 38));
    return `<span class="hour-bar ${count ? 'strong' : ''}" style="height:${height}px"></span>`;
  }).join('');
}

function renderTimeline(visible){
  if (!visible.length){
    logList.innerHTML = '<div class="empty">No activities found.</div>';
    return;
  }
  const groups = new Map();
  visible.forEach(log => {
    const key = hourKey(logDate(log));
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(log);
  });
  logList.innerHTML = Array.from(groups.entries()).map(([hour, group]) => `
    <section class="hour-group">
      <div class="hour-label">${escapeHtml(hour)} - ${group.length} ${group.length === 1 ? 'event' : 'events'}</div>
      <div class="gemini-table-wrap">
        <table class="gemini-table activity-table">
          <thead>
            <tr>
              <th class="gemini-time">Time</th>
              <th class="gemini-user">User</th>
              <th class="gemini-action">Action</th>
              <th class="gemini-patient">Patient</th>
              <th class="gemini-uhid">UHID</th>
              <th class="gemini-type">Type</th>
              <th class="gemini-doctor">Doctor</th>
              <th class="gemini-page">Page</th>
            </tr>
          </thead>
          <tbody>
            ${group.map(log => {
              const category = selectedActivityTab === 'gemini' && isGeminiApiLog(log) ? 'gemini' : categoryForLog(log);
              const date = logDate(log);
              const user = logActor(log);
              const detail = logActorDetail(log);
              return `
                <tr>
                  <td class="gemini-time">${escapeHtml(timeText(date))}</td>
                  <td class="gemini-user" title="${escapeHtml(detail)}">${escapeHtml(user.replace(/@.*/, '') || user)}</td>
                  <td class="gemini-action" title="${escapeHtml(sameActionText(log))}">${escapeHtml(sameActionText(log))}</td>
                  <td class="gemini-patient" title="${escapeHtml(actionTarget(log))}">${escapeHtml(actionTarget(log))}</td>
                  <td class="gemini-uhid" title="${escapeHtml(log.uhid || '')}">${escapeHtml(geminiValue(log.uhid))}</td>
                  <td class="gemini-type"><span class="event-badge ${category}">${escapeHtml(category)}</span></td>
                  <td class="gemini-doctor" title="${escapeHtml(logDoctorCredential(log))}">${escapeHtml(logDoctorCredential(log))}</td>
                  <td class="gemini-page">${escapeHtml(geminiValue(log.page))}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </section>
  `).join('');
}

function renderGeminiTimeline(visible){
  if (!visible.length){
    logList.innerHTML = '<div class="empty">No Gemini API use found.</div>';
    return;
  }
  const groups = new Map();
  visible.forEach(log => {
    const key = hourKey(logDate(log));
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(log);
  });
  logList.innerHTML = Array.from(groups.entries()).map(([hour, group]) => `
    <section class="hour-group">
      <div class="hour-label">${escapeHtml(hour)} - ${group.length} ${group.length === 1 ? 'API event' : 'API events'}</div>
      <div class="gemini-table-wrap">
        <table class="gemini-table">
          <thead>
            <tr>
              <th class="gemini-time">Time</th>
              <th class="gemini-user">User</th>
              <th class="gemini-action">Action</th>
              <th class="gemini-patient">Patient</th>
              <th class="gemini-uhid">UHID</th>
              <th class="gemini-duration">Recording</th>
              <th class="gemini-model">Model</th>
              <th class="gemini-attempt">Attempt</th>
              <th class="gemini-doctor">Doctor</th>
              <th class="gemini-page">Page</th>
            </tr>
          </thead>
          <tbody>
            ${group.map(log => {
              const date = logDate(log);
              const user = logActor(log);
              const detail = logActorDetail(log);
              return `
                <tr>
                  <td class="gemini-time">${escapeHtml(timeText(date))}</td>
                  <td class="gemini-user" title="${escapeHtml(detail)}">${escapeHtml(user.replace(/@.*/, '') || user)}</td>
                  <td class="gemini-action" title="${escapeHtml(sameActionText(log))}">${escapeHtml(sameActionText(log))}</td>
                  <td class="gemini-patient" title="${escapeHtml(actionTarget(log))}">${escapeHtml(actionTarget(log))}</td>
                  <td class="gemini-uhid" title="${escapeHtml(log.uhid || '')}">${escapeHtml(geminiValue(log.uhid))}</td>
                  <td class="gemini-duration">${escapeHtml(geminiDuration(log))}</td>
                  <td class="gemini-model" title="${escapeHtml(log.geminiModel || '')}">${escapeHtml(geminiValue(log.geminiModel))}</td>
                  <td class="gemini-attempt">${escapeHtml(geminiAttempts(log))}</td>
                  <td class="gemini-doctor" title="${escapeHtml(logDoctorCredential(log))}">${escapeHtml(logDoctorCredential(log))}</td>
                  <td class="gemini-page">${escapeHtml(geminiValue(log.page))}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </section>
  `).join('');
}

function render(){
  const dateLogs = baseDateLogs();
  const visible = filteredLogs();
  noteSubfilters.classList.toggle('visible', selectedActivityTab === 'notes');
  dashboardGrid.classList.toggle('gemini-mode', selectedActivityTab === 'gemini');
  noteFilterButtons.forEach(button => button.classList.toggle('active', button.dataset.noteFilter === selectedNoteFilter));
  updateCounts(dateLogs);
  updateStats(visible, dateLogs);
  updateHourBars(dateLogs);
  if (selectedActivityTab === 'gemini'){
    renderGeminiTimeline(visible);
  }else{
    renderTimeline(visible);
  }
}

function subscribeLogs(){
  if (unsubscribeLogs) unsubscribeLogs();
  const logsQuery = query(collection(db, 'activityLogs'), orderBy('createdAt', 'desc'), limit(500));
  unsubscribeLogs = onSnapshot(logsQuery, snapshot => {
    logs = snapshot.docs.map(doc => ({id:doc.id, ...doc.data()}));
    render();
  }, error => {
    console.error(error);
    logList.innerHTML = `<div class="empty">${escapeHtml(error.message || 'Unable to load activity logs.')}</div>`;
  });
}

function subscribeUserProfiles(){
  if (unsubscribeUsers) unsubscribeUsers();
  unsubscribeUsers = onSnapshot(collection(db, 'users'), snapshot => {
    userProfiles = new Map(snapshot.docs.map(doc => [doc.id, doc.data() || {}]));
    render();
  }, error => {
    console.warn('Unable to load user profile labels:', error);
    userProfiles = new Map();
    render();
  });
}

loginForm.addEventListener('submit', async event => {
  event.preventDefault();
  loginError.textContent = '';
  loginSubmit.disabled = true;
  loginSubmit.textContent = 'Signing in...';
  try{
    await signInWithEmailAndPassword(auth, loginEmail.value.trim(), loginPassword.value);
    loginPassword.value = '';
  }catch(error){
    loginError.textContent = 'Unable to sign in. Check the email and password.';
  }finally{
    loginSubmit.disabled = false;
    loginSubmit.textContent = 'Sign in';
  }
});

onAuthStateChanged(auth, user => {
  if (unsubscribeLogs) unsubscribeLogs();
  if (unsubscribeUsers) unsubscribeUsers();
  unsubscribeLogs = null;
  unsubscribeUsers = null;
  logs = [];
  userProfiles = new Map();
  render();
  if (!user){
    appShell.classList.remove('authenticated');
    loginScreen.classList.remove('hidden');
    userEmail.textContent = '';
    return;
  }
  const email = String(user.email || '').toLowerCase();
  if (email !== LOG_ADMIN_EMAIL){
    signOut(auth).catch(() => {});
    appShell.classList.remove('authenticated');
    loginScreen.classList.remove('hidden');
    loginError.textContent = 'This account is not authorized for the activity log.';
    return;
  }
  loginScreen.classList.add('hidden');
  appShell.classList.add('authenticated');
  userEmail.textContent = user.email || '';
  footerAvatar.textContent = initials(user.email || 'Dr Gigy');
  updateDateControls();
  subscribeUserProfiles();
  subscribeLogs();
});

searchInput.addEventListener('input', () => {
  searchTerm = searchInput.value || '';
  render();
});
dateInput.addEventListener('input', () => setSelectedDate(dateInput.value || dateInputValue(new Date()), 'today'));
previousDateBtn.addEventListener('click', () => moveSelectedDate(-1));
nextDateBtn.addEventListener('click', () => moveSelectedDate(1));
refreshBtn.addEventListener('click', subscribeLogs);
signoutBtn.addEventListener('click', () => signOut(auth));
streamButtons.forEach(button => {
  button.addEventListener('click', () => {
    selectedActivityTab = button.dataset.tab || 'all';
    streamButtons.forEach(item => item.classList.toggle('active', item === button));
    render();
  });
});
noteFilterButtons.forEach(button => {
  button.addEventListener('click', () => {
    selectedActivityTab = 'notes';
    selectedNoteFilter = button.dataset.noteFilter || 'all';
    streamButtons.forEach(item => item.classList.toggle('active', item.dataset.tab === 'notes'));
    render();
  });
});
quickButtons.forEach(button => {
  button.addEventListener('click', () => {
    selectedQuickFilter = selectedQuickFilter === button.dataset.quick ? '' : button.dataset.quick;
    quickButtons.forEach(item => item.classList.toggle('active', item.dataset.quick === selectedQuickFilter));
    render();
  });
});
rangeButtons.forEach(button => {
  button.addEventListener('click', () => {
    const today = dateInputValue(new Date());
    if (button.dataset.range === 'today') setSelectedDate(today, 'today');
    if (button.dataset.range === 'yesterday'){
      const date = new Date();
      date.setDate(date.getDate() - 1);
      setSelectedDate(dateInputValue(date), 'yesterday');
    }
    if (button.dataset.range === '7days') setSelectedDate(today, '7days');
  });
});
updateDateControls();
</script>
</body>
</html>

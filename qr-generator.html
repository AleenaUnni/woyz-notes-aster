<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WOYZ QR Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@500;700;800;900&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2521;
    --muted:#6F796F;
    --soft:#A3AAA3;
    --teal:#1F6B59;
    --teal-dark:#174E43;
    --teal-wash:#E9F2EF;
    --red:#E34836;
    --border:#DFE6E1;
    --paper:#F7F5F0;
    --card:#FFFEFC;
    --shadow:0 22px 50px -38px rgba(21,28,38,.45);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; color:var(--ink); background:var(--paper); font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  button,input{ font:inherit; }
  button{ cursor:pointer; }
  .login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px; background:linear-gradient(145deg,#F7F5F0,#EAF2EF); }
  .login-screen.hidden{ display:none; }
  .login-card{ width:min(420px,100%); background:#fff; border:1px solid var(--border); border-radius:22px; padding:34px; box-shadow:var(--shadow); }
  .login-card h1{ margin:26px 0 6px; font:700 30px/1.1 'Fraunces',serif; letter-spacing:0; }
  .login-card .brand{ gap:9px; }
  .login-card .brand-pill{ height:48px; border-width:3px; font-size:20px; padding:0 15px 0 11px; }
  .login-card .brand-dot{ width:25px; height:25px; border-width:7px; }
  .login-card .btn{ width:100%; margin-top:16px; background:var(--teal); border-color:var(--teal); color:#fff; }
  .error{ min-height:18px; margin-top:12px; color:var(--red); font-size:12px; font-weight:800; }
  .page{ min-height:100vh; display:none; grid-template-columns:360px minmax(0,1fr); }
  .page.authenticated{ display:grid; }
  .sidebar{ background:#fff; border-right:1px solid var(--border); padding:28px 24px; display:flex; flex-direction:column; gap:28px; }
  .brand{ display:flex; align-items:center; gap:13px; }
  .brand-pill{ height:58px; border:4px solid #F45155; border-radius:999px; background:#17171D; color:#fff; display:flex; align-items:center; justify-content:center; gap:11px; padding:0 18px 0 14px; font-weight:900; font-size:24px; letter-spacing:1.1px; }
  .brand-dot{ width:30px; height:30px; border-radius:50%; background:#F45155; border:8px solid #452126; }
  .brand-word{ font-size:26px; font-weight:900; letter-spacing:-.03em; }
  .form-card{ display:grid; gap:18px; }
  label{ display:block; margin-bottom:8px; color:#5D665F; font-size:12px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
  input{ width:100%; height:48px; border:1.5px solid var(--border); border-radius:12px; padding:0 14px; outline:none; background:#fff; color:var(--ink); font-weight:800; }
  input:focus{ border-color:#9EB9AF; box-shadow:0 0 0 3px rgba(31,107,89,.14); }
  .actions{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px; }
  .btn{ min-height:46px; border:1.5px solid var(--border); border-radius:12px; background:#fff; color:var(--ink); font-weight:900; }
  .btn.primary{ grid-column:1/-1; background:var(--teal); border-color:var(--teal); color:#fff; }
  .btn.primary:hover{ background:var(--teal-dark); }
  .btn:hover{ background:#F2F4F1; }
  .hint{ color:var(--muted); font-size:13px; font-weight:700; line-height:1.5; }
  .content{ min-width:0; padding:40px; display:flex; align-items:center; justify-content:center; }
  .preview{ width:min(620px,100%); background:var(--card); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:34px; display:grid; gap:24px; }
  .qr-stage{ display:grid; place-items:center; padding:24px; border:1px dashed #D8E0DA; border-radius:16px; background:#FAFBF9; }
  .user-row{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:12px; color:var(--muted); font-size:13px; font-weight:800; }
  .link-btn{ border:0; background:transparent; color:var(--red); font-weight:900; padding:0; }
  canvas{ width:min(360px,100%); height:auto; image-rendering:pixelated; background:#fff; border-radius:10px; box-shadow:0 16px 42px -34px rgba(20,27,24,.45); }
  .print-card{ display:none; }
  @media (max-width:860px){
    .page{ grid-template-columns:1fr; }
    .sidebar{ border-right:0; border-bottom:1px solid var(--border); }
    .content{ padding:24px; }
    .preview{ padding:24px; }
  }
  @media print{
    body{ background:#fff; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
    .page{ display:block; min-height:auto; }
    .login-screen,.sidebar{ display:none !important; }
    .content{ display:block; padding:0; }
    .preview{ box-shadow:none; border:0; padding:0; width:100%; }
    .qr-stage{ display:none; }
    .print-card{ display:grid; width:86mm; margin:8mm auto 0; gap:7mm; justify-items:center; color:#111; font-family:Arial,sans-serif; }
    .print-card canvas{ width:52mm !important; height:52mm !important; box-shadow:none; border-radius:0; }
    .print-lines{ width:100%; display:grid; gap:5mm; font-size:16pt; line-height:1.2; }
  }
</style>
</head>
<body>
<section class="login-screen" id="loginScreen">
  <form class="login-card" id="loginForm">
    <div class="brand">
      <div class="brand-pill"><span class="brand-dot"></span><span>WOYZ</span></div>
      <div class="brand-word">QR</div>
    </div>
    <h1>QR generator login</h1>
    <p class="hint">Sign in with the QR generator account to generate doctor QR codes.</p>
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" autocomplete="username" required>
    <label for="loginPassword">Password</label>
    <input id="loginPassword" type="password" autocomplete="current-password" required>
    <button class="btn" id="loginSubmit" type="submit">Sign in</button>
    <div class="error" id="loginError" role="alert"></div>
  </form>
</section>
<main class="page" id="appShell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-pill"><span class="brand-dot"></span><span>WOYZ</span></div>
      <div class="brand-word">QR</div>
    </div>
    <section class="form-card" aria-label="QR details">
      <div>
        <label for="doctorName">Doctor name</label>
        <input id="doctorName" type="text" autocomplete="off" placeholder="Dr. Varghese">
      </div>
      <div>
        <label for="employeeId">Employee ID</label>
        <input id="employeeId" type="text" autocomplete="off" placeholder="102345">
      </div>
      <div class="actions">
        <button class="btn primary" id="generateBtn" type="button">Generate QR</button>
        <button class="btn" id="downloadBtn" type="button">Download</button>
        <button class="btn" id="printBtn" type="button">Print</button>
      </div>
      <p class="hint">QR text format: Aster@doc1, doctor name, employee ID.</p>
    </section>
    <div class="user-row">
      <span id="userEmail"></span>
      <button class="link-btn" id="signoutBtn" type="button">Sign out</button>
    </div>
  </aside>
  <section class="content">
    <article class="preview">
      <div class="qr-stage">
        <canvas id="qrCanvas" width="420" height="420" aria-label="Generated QR code"></canvas>
      </div>
      <div class="print-card" id="printCard">
        <canvas id="printCanvas" width="420" height="420"></canvas>
        <div class="print-lines">
          <div>Aster@doc1</div>
          <div id="printDoctorName">Dr. Varghese</div>
          <div>Emp No: <span id="printEmployeeId">102345</span></div>
        </div>
      </div>
    </article>
  </section>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
import { browserLocalPersistence, getAuth, onAuthStateChanged, setPersistence, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
import { firebaseConfig } from './firebase-config.js';

const QR_GENERATOR_EMAIL = 'aster-admin@woyz.in';
const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
setPersistence(auth, browserLocalPersistence).catch(error => console.warn('Unable to enable persistent login:', error));

const loginScreen = document.getElementById('loginScreen');
const loginForm = document.getElementById('loginForm');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const loginSubmit = document.getElementById('loginSubmit');
const loginError = document.getElementById('loginError');
const appShell = document.getElementById('appShell');
const userEmail = document.getElementById('userEmail');
const signoutBtn = document.getElementById('signoutBtn');
const doctorNameInput = document.getElementById('doctorName');
const employeeIdInput = document.getElementById('employeeId');
const generateBtn = document.getElementById('generateBtn');
const downloadBtn = document.getElementById('downloadBtn');
const printBtn = document.getElementById('printBtn');
const qrCanvas = document.getElementById('qrCanvas');
const printCanvas = document.getElementById('printCanvas');
const printDoctorName = document.getElementById('printDoctorName');
const printEmployeeId = document.getElementById('printEmployeeId');
const QR_VERSION = 4;
const QR_SIZE = 17 + QR_VERSION * 4;
const DATA_CODEWORDS = 80;
const EC_CODEWORDS = 20;
const FORMAT_MASK = 0x5412;
const FORMAT_POLY = 0x537;
let currentPayload = '';

function isQrGeneratorUser(user){
  return !!user && String(user.email || '').toLowerCase() === QR_GENERATOR_EMAIL;
}

function escapeFilename(value){
  return String(value || 'doctor').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase() || 'doctor';
}

function qrPayload(){
  const doctorName = doctorNameInput.value.trim() || 'Dr. Varghese';
  const employeeId = employeeIdInput.value.trim() || '102345';
  return {
    doctorName,
    employeeId,
    text:`Aster@doc1,${doctorName},${employeeId}`
  };
}

function createMatrix(size){
  return {
    modules:Array.from({length:size}, () => Array(size).fill(false)),
    reserved:Array.from({length:size}, () => Array(size).fill(false))
  };
}

function setModule(qr, x, y, dark, reserve = true){
  if (x < 0 || y < 0 || x >= QR_SIZE || y >= QR_SIZE) return;
  qr.modules[y][x] = !!dark;
  if (reserve) qr.reserved[y][x] = true;
}

function drawFinder(qr, x, y){
  for (let dy = -1; dy <= 7; dy += 1){
    for (let dx = -1; dx <= 7; dx += 1){
      const xx = x + dx;
      const yy = y + dy;
      if (xx < 0 || yy < 0 || xx >= QR_SIZE || yy >= QR_SIZE) continue;
      const inCore = dx >= 0 && dx <= 6 && dy >= 0 && dy <= 6;
      const dark = inCore && (dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4));
      setModule(qr, xx, yy, dark);
    }
  }
}

function drawAlignment(qr, cx, cy){
  for (let dy = -2; dy <= 2; dy += 1){
    for (let dx = -2; dx <= 2; dx += 1){
      const dark = Math.max(Math.abs(dx), Math.abs(dy)) !== 1;
      setModule(qr, cx + dx, cy + dy, dark);
    }
  }
}

function reserveFormat(qr){
  for (let i = 0; i < 9; i += 1){
    if (i !== 6){
      qr.reserved[8][i] = true;
      qr.reserved[i][8] = true;
    }
  }
  for (let i = 0; i < 8; i += 1){
    qr.reserved[QR_SIZE - 1 - i][8] = true;
    qr.reserved[8][QR_SIZE - 1 - i] = true;
  }
}

function drawFunctionPatterns(qr){
  drawFinder(qr, 0, 0);
  drawFinder(qr, QR_SIZE - 7, 0);
  drawFinder(qr, 0, QR_SIZE - 7);
  for (let i = 8; i < QR_SIZE - 8; i += 1){
    setModule(qr, i, 6, i % 2 === 0);
    setModule(qr, 6, i, i % 2 === 0);
  }
  drawAlignment(qr, 26, 26);
  setModule(qr, 8, 4 * QR_VERSION + 9, true);
  reserveFormat(qr);
}

function appendBits(bits, value, length){
  for (let i = length - 1; i >= 0; i -= 1) bits.push(((value >>> i) & 1) === 1);
}

function payloadCodewords(text){
  const bytes = Array.from(new TextEncoder().encode(text));
  if (bytes.length > 78) throw new Error('QR text is too long. Please shorten the doctor name or employee ID.');
  const bits = [];
  appendBits(bits, 0b0100, 4);
  appendBits(bits, bytes.length, 8);
  bytes.forEach(byte => appendBits(bits, byte, 8));
  const maxBits = DATA_CODEWORDS * 8;
  const terminator = Math.min(4, maxBits - bits.length);
  appendBits(bits, 0, terminator);
  while (bits.length % 8) bits.push(false);
  const data = [];
  for (let i = 0; i < bits.length; i += 8){
    let value = 0;
    for (let j = 0; j < 8; j += 1) value = (value << 1) | (bits[i + j] ? 1 : 0);
    data.push(value);
  }
  for (let pad = 0; data.length < DATA_CODEWORDS; pad += 1) data.push(pad % 2 ? 0x11 : 0xEC);
  return data;
}

function gfTables(){
  const exp = Array(512).fill(0);
  const log = Array(256).fill(0);
  let x = 1;
  for (let i = 0; i < 255; i += 1){
    exp[i] = x;
    log[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11D;
  }
  for (let i = 255; i < 512; i += 1) exp[i] = exp[i - 255];
  return {exp, log};
}

const GF = gfTables();

function gfMul(a, b){
  if (!a || !b) return 0;
  return GF.exp[GF.log[a] + GF.log[b]];
}

function rsGenerator(degree){
  const result = Array(degree).fill(0);
  result[degree - 1] = 1;
  let root = 1;
  for (let i = 0; i < degree; i += 1){
    for (let j = 0; j < degree; j += 1){
      result[j] = gfMul(result[j], root);
      if (j + 1 < degree) result[j] ^= result[j + 1];
    }
    root = gfMul(root, 2);
  }
  return result;
}

function errorCorrection(data){
  const generator = rsGenerator(EC_CODEWORDS);
  const result = Array(EC_CODEWORDS).fill(0);
  data.forEach(byte => {
    const factor = byte ^ result.shift();
    result.push(0);
    for (let i = 0; i < EC_CODEWORDS; i += 1) result[i] ^= gfMul(generator[i], factor);
  });
  return result;
}

function maskBit(x, y){
  return (x + y) % 2 === 0;
}

function placeData(qr, codewords){
  const bits = [];
  codewords.forEach(byte => appendBits(bits, byte, 8));
  let bitIndex = 0;
  let upward = true;
  for (let right = QR_SIZE - 1; right >= 1; right -= 2){
    if (right === 6) right -= 1;
    for (let vertical = 0; vertical < QR_SIZE; vertical += 1){
      const y = upward ? QR_SIZE - 1 - vertical : vertical;
      for (let col = 0; col < 2; col += 1){
        const x = right - col;
        if (qr.reserved[y][x]) continue;
        const bit = bitIndex < bits.length ? bits[bitIndex] : false;
        bitIndex += 1;
        setModule(qr, x, y, bit !== maskBit(x, y), false);
      }
    }
    upward = !upward;
  }
}

function formatBits(){
  let value = (0b01 << 3) | 0;
  let data = value << 10;
  for (let i = 14; i >= 10; i -= 1){
    if ((data >>> i) & 1) data ^= FORMAT_POLY << (i - 10);
  }
  return ((value << 10) | data) ^ FORMAT_MASK;
}

function drawFormat(qr){
  const bits = formatBits();
  const first = [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
  const second = [[QR_SIZE-1,8],[QR_SIZE-2,8],[QR_SIZE-3,8],[QR_SIZE-4,8],[QR_SIZE-5,8],[QR_SIZE-6,8],[QR_SIZE-7,8],[QR_SIZE-8,8],[8,QR_SIZE-7],[8,QR_SIZE-6],[8,QR_SIZE-5],[8,QR_SIZE-4],[8,QR_SIZE-3],[8,QR_SIZE-2],[8,QR_SIZE-1]];
  first.forEach(([x, y], index) => setModule(qr, x, y, ((bits >>> index) & 1) === 1));
  second.forEach(([x, y], index) => setModule(qr, x, y, ((bits >>> index) & 1) === 1));
}

function makeQr(text){
  const qr = createMatrix(QR_SIZE);
  drawFunctionPatterns(qr);
  const data = payloadCodewords(text);
  placeData(qr, data.concat(errorCorrection(data)));
  drawFormat(qr);
  return qr.modules;
}

function drawQr(canvas, text){
  const modules = makeQr(text);
  const context = canvas.getContext('2d');
  const scale = Math.floor(canvas.width / (QR_SIZE + 8));
  const offset = Math.floor((canvas.width - (QR_SIZE + 8) * scale) / 2);
  context.fillStyle = '#FFFFFF';
  context.fillRect(0, 0, canvas.width, canvas.height);
  context.fillStyle = '#111111';
  modules.forEach((row, y) => {
    row.forEach((dark, x) => {
      if (dark) context.fillRect(offset + (x + 4) * scale, offset + (y + 4) * scale, scale, scale);
    });
  });
}

function render(){
  const payload = qrPayload();
  currentPayload = payload.text;
  printDoctorName.textContent = payload.doctorName;
  printEmployeeId.textContent = payload.employeeId;
  try{
    drawQr(qrCanvas, payload.text);
    drawQr(printCanvas, payload.text);
    downloadBtn.disabled = false;
    printBtn.disabled = false;
  }catch(error){
    window.alert(error.message);
    downloadBtn.disabled = true;
    printBtn.disabled = true;
  }
}

loginForm.addEventListener('submit', async event => {
  event.preventDefault();
  loginError.textContent = '';
  loginSubmit.disabled = true;
  loginSubmit.textContent = 'Signing in...';
  try{
    await signInWithEmailAndPassword(auth, loginEmail.value.trim(), loginPassword.value);
    loginPassword.value = '';
  }catch(error){
    loginError.textContent = 'Unable to sign in. Check the QR generator email and password.';
  }finally{
    loginSubmit.disabled = false;
    loginSubmit.textContent = 'Sign in';
  }
});

signoutBtn.addEventListener('click', () => {
  signOut(auth).catch(error => console.error(error));
});

onAuthStateChanged(auth, async user => {
  if (!user){
    appShell.classList.remove('authenticated');
    loginScreen.classList.remove('hidden');
    userEmail.textContent = '';
    return;
  }
  if (!isQrGeneratorUser(user)){
    await signOut(auth).catch(error => console.error(error));
    loginError.textContent = 'This page is restricted to the QR generator account.';
    appShell.classList.remove('authenticated');
    loginScreen.classList.remove('hidden');
    userEmail.textContent = '';
    return;
  }
  loginScreen.classList.add('hidden');
  appShell.classList.add('authenticated');
  userEmail.textContent = user.email || '';
  render();
});

generateBtn.addEventListener('click', render);
doctorNameInput.addEventListener('input', render);
employeeIdInput.addEventListener('input', render);
downloadBtn.addEventListener('click', () => {
  const payload = qrPayload();
  const link = document.createElement('a');
  link.download = `aster-doc1-${escapeFilename(payload.doctorName)}-${escapeFilename(payload.employeeId)}.png`;
  link.href = qrCanvas.toDataURL('image/png');
  link.click();
});
printBtn.addEventListener('click', () => window.print());

doctorNameInput.value = 'Dr. Varghese';
employeeIdInput.value = '102345';
render();
</script>
</body>
</html>
